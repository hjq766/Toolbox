<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宽高比换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .cs-stage{display:flex;align-items:center;justify-content:center;min-height:460px;background:var(--bg-surface-2);border-radius:var(--radius-md);padding:var(--space-6)}
    .cs-box{background:var(--color-brand);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);transition:width var(--dur-slow),height var(--dur-slow)}
    .cs-box-ratio{font-size:var(--text-xl);font-weight:700;color:var(--fg-invert)}
    .cs-box-size{font-size:var(--text-xs);color:var(--fg-invert);opacity:.75}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_scale">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：输入 + 预览 -->
          <div>
            <div class="panel">
              <div class="u-row u-gap-3" style="align-items:flex-end;flex-wrap:wrap">
                <div class="field" style="flex:1;min-width:120px">
                  <label class="field-label" for="cs-w">宽</label>
                  <div class="input-group">
                    <input class="input u-mono" id="cs-w" type="number" data-w value="1920" min="1">
                    <span class="addon">px</span>
                  </div>
                </div>
                <span class="u-muted" style="padding-bottom:var(--space-2)">×</span>
                <div class="field" style="flex:1;min-width:120px">
                  <label class="field-label" for="cs-h">高</label>
                  <div class="input-group">
                    <input class="input u-mono" id="cs-h" type="number" data-h value="1080" min="1">
                    <span class="addon">px</span>
                  </div>
                </div>
                <label class="checkbox" style="font-size:var(--text-sm);padding-bottom:var(--space-2);white-space:nowrap">
                  <input type="checkbox" data-lock checked> 锁定比例
                </label>
              </div>
            </div>
            <div class="cs-stage">
              <div class="cs-box" data-preview>
                <span class="cs-box-ratio" data-preview-ratio>16:9</span>
                <span class="cs-box-size" data-preview-size>1920 × 1080</span>
              </div>
            </div>
          </div>

          <!-- 右：侧栏 -->
          <aside>
            <!-- 比例预设 -->
            <div class="panel">
              <h3 class="panel-title">比例预设</h3>

              <label class="field-label">屏幕 / 视频</label>
              <div class="opt-row u-mb-3">
                <button class="btn is-sm active" data-ratio="16:9">16:9</button>
                <button class="btn is-sm" data-ratio="16:10">16:10</button>
                <button class="btn is-sm" data-ratio="4:3">4:3</button>
                <button class="btn is-sm" data-ratio="21:9">21:9</button>
                <button class="btn is-sm" data-ratio="32:9">32:9</button>
                <button class="btn is-sm" data-ratio="1:1">1:1</button>
              </div>

              <label class="field-label">社交媒体</label>
              <div class="opt-row u-mb-3">
                <button class="btn is-sm" data-ratio="9:16" data-preset='{"w":1080,"h":1920}'>竖屏 9:16</button>
                <button class="btn is-sm" data-ratio="4:5" data-preset='{"w":1080,"h":1350}'>Ins 竖图</button>
                <button class="btn is-sm" data-ratio="3:4" data-preset='{"w":1080,"h":1440}'>小红书</button>
                <button class="btn is-sm" data-ratio="2.35:1" data-preset='{"w":900,"h":383}'>公众号封面</button>
                <button class="btn is-sm" data-ratio="2.35:1" data-preset='{"w":1280,"h":545}'>B站封面</button>
              </div>

              <label class="field-label">摄影 / 印刷</label>
              <div class="opt-row u-mb-3">
                <button class="btn is-sm" data-ratio="3:2">3:2</button>
                <button class="btn is-sm" data-ratio="5:4">5:4</button>
                <button class="btn is-sm" data-ratio="7:5">7:5</button>
                <button class="btn is-sm" data-ratio="6:4">6:4</button>
                <button class="btn is-sm" data-ratio="1:1.414" data-preset='{"w":2480,"h":3508}'>A4 纸</button>
                <button class="btn is-sm" data-ratio="1:1.414" data-preset='{"w":3508,"h":4961}'>A3 纸</button>
              </div>

              <label class="field-label">电影</label>
              <div class="opt-row u-mb-3">
                <button class="btn is-sm" data-ratio="1.85:1" data-preset='{"w":1998,"h":1080}'>1.85:1</button>
                <button class="btn is-sm" data-ratio="2.35:1" data-preset='{"w":2538,"h":1080}'>2.35:1</button>
                <button class="btn is-sm" data-ratio="2.39:1" data-preset='{"w":2581,"h":1080}'>2.39:1</button>
                <button class="btn is-sm" data-ratio="1.33:1">学院比</button>
              </div>

              <label class="field-label">移动设备</label>
              <div class="opt-row">
                <button class="btn is-sm" data-ratio="9:19.5" data-preset='{"w":390,"h":844}'>iPhone 15</button>
                <button class="btn is-sm" data-ratio="9:19.5" data-preset='{"w":430,"h":932}'>iPhone Max</button>
                <button class="btn is-sm" data-ratio="9:20" data-preset='{"w":360,"h":800}'>Android</button>
                <button class="btn is-sm" data-ratio="3:4" data-preset='{"w":768,"h":1024}'>iPad</button>
                <button class="btn is-sm" data-ratio="2:3" data-preset='{"w":820,"h":1180}'>iPad Air</button>
                <button class="btn is-sm" data-ratio="4:3" data-preset='{"w":2048,"h":1536}'>iPad Pro</button>
              </div>
            </div>


            <!-- 信息 -->
            <div class="panel">
              <h3 class="panel-title">信息</h3>
              <div class="u-col u-gap-2" style="font-size:var(--text-sm)">
                <div class="u-row u-between"><span class="u-muted">简化比例</span><strong data-stat="ratio">16:9</strong></div>
                <div class="u-row u-between"><span class="u-muted">比值</span><span data-stat="value">1.778</span></div>
                <div class="u-row u-between"><span class="u-muted">对角线</span><span data-stat="diag">2203 px</span></div>
                <div class="u-row u-between"><span class="u-muted">总像素</span><span data-stat="pixels">2.07M</span></div>
                <div class="u-row u-between"><span class="u-muted">方向</span><span data-stat="orient">横向</span></div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="swap"><i data-lucide="arrow-left-right"></i> 交换宽高</button>
                <button class="btn" type="button" data-action="copy"><i data-lucide="copy"></i> 复制信息</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
