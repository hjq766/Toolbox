<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色混合 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .cm-color-pick{width:40px;height:32px;border:1px solid var(--border-base);border-radius:var(--radius-sm);cursor:pointer;padding:0}
    .color-block{height:100px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:flex-end;padding:var(--space-2);transition:box-shadow .15s}
    .color-block:hover{box-shadow:0 0 0 3px var(--color-brand)}
    .gradient-box{height:140px;border-radius:var(--radius-md);transition:background .2s}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="color_mixing">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：预览 -->
          <div>
            <!-- 三色块 -->
            <div class="grid grid-3 u-mb-4" style="gap:var(--space-3)">
              <div>
                <div class="color-block" data-preview="c1" data-copy></div>
                <div class="u-text-center u-mt-2 u-text-sm" data-hex="c1"></div>
                <div class="u-text-center u-muted u-text-xs" data-rgb="c1"></div>
              </div>
              <div>
                <div class="color-block" data-preview="mix" data-copy></div>
                <div class="u-text-center u-mt-2 u-strong u-text-sm" data-hex="mix"></div>
                <div class="u-text-center u-muted u-text-xs" data-rgb="mix"></div>
              </div>
              <div>
                <div class="color-block" data-preview="c2" data-copy></div>
                <div class="u-text-center u-mt-2 u-text-sm" data-hex="c2"></div>
                <div class="u-text-center u-muted u-text-xs" data-rgb="c2"></div>
              </div>
            </div>

            <!-- 渐变预览 -->
            <div class="panel">
              <h3 class="panel-title">渐变预览</h3>
              <div class="gradient-box" data-gradient></div>
              <div class="field u-mt-3">
                <textarea class="input u-mono u-text-xs" data-gradient-code rows="2" readonly></textarea>
              </div>
              <button class="btn is-sm u-mt-2" data-action="copy-gradient"><i data-lucide="copy"></i> 复制 CSS</button>
            </div>
          </div>

          <!-- 右：设置 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">颜色 1</h3>
              <div class="u-row u-gap-2 u-center">
                <input type="color" class="cm-color-pick" data-picker="c1" value="#FF6B6B">
                <input class="input" data-text="c1" value="#FF6B6B" style="flex:1">
              </div>
              <div class="field u-mt-2">
                <label class="field-label">权重</label>
                <div class="range-row">
                  <input type="range" data-weight="c1" min="0" max="100" value="50">
                  <span class="val" data-weight-val="c1">50%</span>
                </div>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">颜色 2</h3>
              <div class="u-row u-gap-2 u-center">
                <input type="color" class="cm-color-pick" data-picker="c2" value="#4ECDC4">
                <input class="input" data-text="c2" value="#4ECDC4" style="flex:1">
              </div>
              <div class="field u-mt-2">
                <label class="field-label">权重</label>
                <div class="range-row">
                  <input type="range" data-weight="c2" min="0" max="100" value="50">
                  <span class="val" data-weight-val="c2">50%</span>
                </div>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">渐变设置</h3>
              <div class="field">
                <label class="field-label">类型</label>
                <select class="input" data-grad-type>
                  <option value="linear">线性</option>
                  <option value="radial">径向</option>
                </select>
              </div>
              <div class="field u-mt-2">
                <label class="field-label">角度</label>
                <div class="range-row">
                  <input type="range" data-grad-angle min="0" max="360" value="90">
                  <span class="val" data-angle-val>90°</span>
                </div>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
