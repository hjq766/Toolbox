<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机密码生成 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="rand_password">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">
        <!-- 结果 -->
        <div class="panel">
          <div class="result-strip u-mono" data-output style="font-size:20px;font-weight:600;word-break:break-all">—</div>
          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" data-gen><i data-lucide="refresh-cw"></i> 生成</button>
            <button class="btn" data-copy><i data-lucide="copy"></i> 复制</button>
            <div class="u-grow"></div>
            <span class="badge" data-strength>强度：—</span>
          </div>
        </div>

        <!-- 参数 + 批量 -->
        <div class="grid grid-2">
          <div class="panel">
            <h3 class="panel-title">参数设置</h3>
            <div class="field u-mb-4">
              <label class="field-label u-row u-between">密码长度 <strong data-len-display>16</strong></label>
              <input type="range" min="4" max="64" value="16" data-len>
            </div>
            <div class="u-col u-gap-3">
              <label class="checkbox"><input type="checkbox" data-opt="lower" checked> 小写字母 (a–z)</label>
              <label class="checkbox"><input type="checkbox" data-opt="upper" checked> 大写字母 (A–Z)</label>
              <label class="checkbox"><input type="checkbox" data-opt="digits" checked> 数字 (0–9)</label>
              <label class="checkbox"><input type="checkbox" data-opt="symbols"> 符号 (!@#$…)</label>
              <label class="checkbox"><input type="checkbox" data-opt="noSimilar"> 排除易混字符</label>
              <label class="checkbox"><input type="checkbox" data-opt="unique"> 每个字符不重复</label>
            </div>
          </div>

          <div class="panel">
            <h3 class="panel-title u-row u-between">批量生成 <button class="btn is-sm" data-batch>生成 10 条</button></h3>
            <pre class="textarea u-mono" data-batch-out style="min-height:180px;white-space:pre"></pre>
          </div>
        </div>
      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
