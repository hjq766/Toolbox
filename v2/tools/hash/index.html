<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈希计算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <script src="../../public/vendor/crypto-js.min.js" defer></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="hash">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="tabs" role="tablist" aria-label="模式切换">
          <button class="tab-btn is-active" data-mode="text" type="button">文本哈希</button>
          <button class="tab-btn" data-mode="file" type="button">文件哈希</button>
        </div>

        <!-- 文本模式 -->
        <div class="panel" data-view="text">
          <div class="grid grid-2">
            <div class="field">
              <label class="field-label" for="h-text">文本内容</label>
              <textarea class="textarea" id="h-text" data-input="text" placeholder="粘贴或输入需要计算哈希的文本…" style="min-height:160px"></textarea>
            </div>
            <div class="field">
              <label class="field-label" for="h-key">密钥 (可选，填写后自动计算 HMAC)</label>
              <textarea class="textarea" id="h-key" data-input="key" placeholder="例如：your-secret-key" style="min-height:160px"></textarea>
            </div>
          </div>
          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" type="button" data-action="calc-text">计算哈希</button>
            <button class="btn is-ghost" type="button" data-action="clear-text">清空</button>
          </div>
        </div>

        <!-- 文件模式 -->
        <div class="panel" data-view="file" hidden>
          <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8)">
            <i data-lucide="upload" class="u-muted" style="width:32px;height:32px"></i>
            <div class="u-strong">拖拽文件到此处，或点击选择</div>
            <div class="u-muted" style="font-size:var(--text-xs)">支持一次选多个文件，全部在本地计算，不会上传</div>
            <input type="file" multiple hidden data-input="file">
          </label>

          <h3 class="panel-title u-mt-4">选择算法</h3>
          <div class="grid grid-3 u-gap-3">
            <label class="checkbox"><input type="checkbox" data-algo="MD5" checked> MD5</label>
            <label class="checkbox"><input type="checkbox" data-algo="SHA1" checked> SHA1</label>
            <label class="checkbox"><input type="checkbox" data-algo="SHA256"> SHA256</label>
            <label class="checkbox"><input type="checkbox" data-algo="SHA512"> SHA512</label>
            <label class="checkbox"><input type="checkbox" data-algo="SHA3"> SHA3</label>
            <label class="checkbox"><input type="checkbox" data-algo="RIPEMD160"> RIPEMD160</label>
          </div>
        </div>

        <!-- 结果区 -->
        <div class="panel" data-result-panel hidden>
          <div class="u-row u-between u-mb-4">
            <h3 class="panel-title" style="margin:0">计算结果</h3>
            <button class="btn is-sm is-ghost" type="button" data-action="clear-result">清空结果</button>
          </div>
          <div class="u-col u-gap-3" data-result-list></div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
