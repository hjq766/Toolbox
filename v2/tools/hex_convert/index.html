<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进制转换 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="hex_convert">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">
        <div class="panel">
          <div class="grid grid-2">
            <div class="field">
              <label class="field-label">二进制 (Binary)</label>
              <div class="input-group">
                <span class="addon">BIN</span>
                <input class="input" type="text" data-base="2" placeholder="0 / 1" spellcheck="false" autocomplete="off">
              </div>
            </div>
            <div class="field">
              <label class="field-label">八进制 (Octal)</label>
              <div class="input-group">
                <span class="addon">OCT</span>
                <input class="input" type="text" data-base="8" spellcheck="false" autocomplete="off">
              </div>
            </div>
            <div class="field">
              <label class="field-label">十进制 (Decimal)</label>
              <div class="input-group">
                <span class="addon">DEC</span>
                <input class="input" type="text" data-base="10" spellcheck="false" autocomplete="off" placeholder="默认从这里输入">
              </div>
            </div>
            <div class="field">
              <label class="field-label">十六进制 (Hex)</label>
              <div class="input-group">
                <span class="addon">HEX</span>
                <input class="input u-mono" type="text" data-base="16" spellcheck="false" autocomplete="off">
              </div>
            </div>
          </div>
          <p class="field-hint u-mt-4">支持任意一栏输入，其它进制实时联动；支持负数；不合法输入会在该栏显示错误。</p>
        </div>

        <div class="panel">
          <h3 class="panel-title">自定义进制 (2–36)</h3>
          <div class="grid grid-3 u-gap-3">
            <div class="field">
              <label class="field-label">输入值</label>
              <input class="input" data-custom-value placeholder="例如 255" autocomplete="off">
            </div>
            <div class="field">
              <label class="field-label">源进制</label>
              <input class="input" type="number" min="2" max="36" value="10" data-custom-from>
            </div>
            <div class="field">
              <label class="field-label">目标进制</label>
              <input class="input" type="number" min="2" max="36" value="16" data-custom-to>
            </div>
          </div>
          <div class="u-row u-between u-mt-4">
            <div class="result-strip" data-custom-result>—</div>
            <button class="btn is-primary" data-copy-custom>复制结果</button>
          </div>
        </div>
      </div>
    </div>
  </div></main></div>

  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
