<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄金比例 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .gr-stage{display:flex;align-items:center;justify-content:center;min-height:360px;background:var(--bg-surface-2);border-radius:var(--radius-md);padding:var(--space-6);flex-direction:column;gap:var(--space-4)}
    .gr-bar{display:flex;width:100%;height:44px;border-radius:var(--radius-md);overflow:hidden;font-size:var(--text-xs);font-weight:600;line-height:44px;text-align:center}
    .gr-bar-l{background:var(--color-brand);color:var(--fg-invert);transition:width var(--dur-slow)}
    .gr-bar-r{background:var(--bg-surface);color:var(--fg-muted);transition:width var(--dur-slow)}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="calc_golden">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：输入 + 预览 -->
          <div>
            <div class="panel">
              <div class="u-row u-gap-3" style="align-items:flex-end;flex-wrap:wrap">
                <div class="field" style="flex:1;min-width:160px">
                  <label class="field-label">总长度</label>
                  <div class="input-group">
                    <input class="input u-mono" type="number" data-total value="1920" min="1" step="1">
                    <span class="addon">px</span>
                  </div>
                </div>
                <div class="field" style="min-width:120px">
                  <label class="field-label">当前比例</label>
                  <div class="input u-mono" style="pointer-events:none;background:var(--bg-surface-2)" data-ratio-label>1 : 1.618</div>
                </div>
              </div>
            </div>
            <!-- 比例条预览 -->
            <div class="gr-stage">
              <div class="gr-bar" style="width:100%">
                <div class="gr-bar-l" data-bar-l>1186px</div>
                <div class="gr-bar-r" data-bar-r>734px</div>
              </div>
            </div>
          </div>

          <!-- 右：侧栏 -->
          <aside>
            <!-- 比例预设 -->
            <div class="panel">
              <h3 class="panel-title">比例预设</h3>

              <label class="field-label">黄金比例系列</label>
              <div class="opt-row u-mb-3">
                <button class="btn active" data-ratio="1.618">1:1.618 黄金</button>
                <button class="btn" data-ratio="0.618">1:0.618 分割</button>
                <button class="btn" data-ratio="2.618">1:2.618 白银</button>
                <button class="btn" data-ratio="0.382">1:0.382 分割</button>
              </div>

              <label class="field-label">数学比例系列</label>
              <div class="opt-row u-mb-3">
                <button class="btn" data-ratio="1.414">1:√2</button>
                <button class="btn" data-ratio="1.732">1:√3</button>
                <button class="btn" data-ratio="2.414">1:2.414 白金</button>
                <button class="btn" data-ratio="2">2:1 双平方</button>
              </div>

              <label class="field-label">常用比例</label>
              <div class="opt-row">
                <button class="btn" data-ratio="1.778">16:9 宽屏</button>
                <button class="btn" data-ratio="1.333">4:3 传统</button>
                <button class="btn" data-ratio="1.5">3:2 全画幅</button>
                <button class="btn" data-ratio="1">1:1 正方形</button>
              </div>
            </div>

            <!-- 计算结果 -->
            <div class="panel">
              <h3 class="panel-title">计算结果</h3>
              <div class="u-col u-gap-2" style="font-size:var(--text-sm)">
                <div class="u-row u-between"><span class="u-muted">长段</span><strong data-long>1186</strong></div>
                <div class="u-row u-between"><span class="u-muted">短段</span><strong data-short>734</strong></div>
                <div class="sep"></div>
                <div class="u-row u-between"><span class="u-muted">比值</span><span data-stat="value">1.618</span></div>
                <div class="u-row u-between"><span class="u-muted">长段占比</span><span data-stat="pct-long">61.8%</span></div>
                <div class="u-row u-between"><span class="u-muted">短段占比</span><span data-stat="pct-short">38.2%</span></div>
                <div class="u-row u-between"><span class="u-muted">长/短</span><span data-stat="ratio-ls">1.615</span></div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy"><i data-lucide="copy"></i> 复制结果</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
