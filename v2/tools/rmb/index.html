<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民币大写 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="rmb">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <!-- 输入 -->
          <div class="input-group">
            <span class="addon">¥</span>
            <input class="input u-mono" type="text" data-digits placeholder="0.00" autocomplete="off" style="font-size:var(--text-lg)">
          </div>
          <div class="opt-row u-mt-4">
            <button class="btn is-sm" type="button" data-quick="100">100</button>
            <button class="btn is-sm" type="button" data-quick="1000">1,000</button>
            <button class="btn is-sm" type="button" data-quick="10000">1万</button>
            <button class="btn is-sm" type="button" data-quick="100000">10万</button>
            <button class="btn is-sm" type="button" data-quick="1000000">100万</button>
          </div>

          <!-- 结果 -->
          <div style="margin-top:var(--space-6);padding:var(--space-5);background:var(--bg-surface-2);border-radius:var(--radius-md);min-height:60px">
            <div data-result style="font-size:var(--text-xl);font-weight:700;line-height:1.8;word-break:break-all;color:var(--fg-strong)">零元整</div>
          </div>

          <!-- 操作 -->
          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" type="button" data-action="copy">复制结果</button>
            <button class="btn is-ghost" type="button" data-action="clear">清空</button>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
