<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渐变色卡 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <style>
    .cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-3)}
    .cg-card{height:140px;border-radius:var(--radius-md);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
    .cg-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
    .cg-name{position:absolute;bottom:0;left:0;right:0;padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-weight:600}
    .cg-code{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;padding:var(--space-3);font-size:11px;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all;opacity:0;transition:opacity .15s}
    .cg-card:hover .cg-code{opacity:1}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="color_gradient">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <!-- 分类 tabs + 计数 -->
        <div class="u-row u-between u-mb-4" style="flex-wrap:wrap;gap:var(--space-2)">
          <div class="tabs" data-cat-tabs></div>
          <span style="font-size:var(--text-xs);color:var(--fg-muted)" data-count></span>
        </div>

        <!-- 卡片网格 -->
        <div class="cg-grid" data-grid></div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
