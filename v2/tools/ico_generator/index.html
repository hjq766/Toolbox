<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICO 图标生成 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <script src="../../public/vendor/jszip.min.js" defer></script>
  <style>
    /* 平台卡片 */
    .plat-row{display:flex;gap:6px;flex-wrap:wrap}
    .plat-card{padding:7px 14px;border:1px solid var(--border-base);border-radius:var(--radius);font-size:var(--text-sm);font-weight:600;cursor:pointer;background:var(--bg-surface);transition:all .15s}
    .plat-card:hover{border-color:var(--color-brand)}
    .plat-card.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand);box-shadow:0 2px 8px rgba(99,102,241,.25)}

    /* 尺寸卡片 */
    .sz-grid{display:flex;flex-wrap:wrap;gap:6px}
    .sz-card{padding:6px 10px;border:1px solid var(--border-base);border-radius:var(--radius-sm);font-size:var(--text-xs);cursor:pointer;transition:all .12s;background:var(--bg-surface);text-align:center;min-width:60px}
    .sz-card:hover{border-color:var(--color-brand)}
    .sz-card.on{background:rgba(99,102,241,.08);border-color:var(--color-brand);color:var(--color-brand)}
    .sz-label{font-weight:700;font-variant-numeric:tabular-nums}
    .sz-desc{font-size:10px;color:var(--fg-muted);margin-top:1px}
    .sz-card.on .sz-desc{color:var(--color-brand)}

    /* 快捷按钮 */
    .quick-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:var(--space-2)}
    .qbtn{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--border-base);border-radius:var(--radius-sm);background:var(--bg-surface-2);cursor:pointer;transition:all .12s}
    .qbtn:hover{border-color:var(--color-brand);color:var(--color-brand)}

    /* 圆角预设 */
    .rp-row{display:flex;gap:4px;margin-top:6px}
    .rp-row button{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--border-base);border-radius:var(--radius-sm);background:var(--bg-surface-2);cursor:pointer;transition:all .12s}
    .rp-row button:hover{border-color:var(--color-brand)}
    .rp-row button.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand)}

    /* 格式卡片 */
    .fmt-grid{display:flex;flex-direction:column;gap:6px}
    .fmt-card{display:flex;align-items:center;gap:var(--space-2);padding:10px 12px;border:1px solid var(--border-base);border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--bg-surface)}
    .fmt-card:hover{border-color:var(--color-brand)}
    .fmt-card.checked{border-color:var(--color-brand);background:rgba(99,102,241,.06)}
    .fmt-card input[type=checkbox]{accent-color:var(--color-brand);width:16px;height:16px;pointer-events:none}
    .fc-title{font-weight:700;font-size:var(--text-sm)}
    .fc-desc{font-size:11px;color:var(--fg-muted)}

    /* 源图预览 */
    .src-wrap{position:relative;background:var(--bg-surface-2);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px}
    .src-wrap canvas{max-width:100%;max-height:280px;display:block}

    /* 裁剪框 */
    .crop-box{position:absolute;border:2px dashed var(--color-brand);cursor:move;display:none;z-index:5}
    .crop-box.vis{display:block}
    .c-h{position:absolute;width:10px;height:10px;background:var(--color-brand);border:1px solid #fff;border-radius:2px}
    .c-h.nw{top:-5px;left:-5px;cursor:nw-resize}.c-h.ne{top:-5px;right:-5px;cursor:ne-resize}
    .c-h.sw{bottom:-5px;left:-5px;cursor:sw-resize}.c-h.se{bottom:-5px;right:-5px;cursor:se-resize}
    .crop-bar{display:flex;gap:var(--space-2);justify-content:center;margin-top:var(--space-2)}

    /* 结果网格 */
    .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--space-3)}
    .icon-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-3);border:1px solid var(--border-base);border-radius:var(--radius);background:var(--bg-surface);text-align:center}
    .ii-preview{display:flex;align-items:center;justify-content:center;min-height:64px}
    .ii-preview canvas{image-rendering:pixelated;border-radius:var(--radius-sm);box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .ii-info{font-size:var(--text-xs)}
    .ii-size{font-weight:700;font-variant-numeric:tabular-nums}
    .ii-fmt{color:var(--fg-muted);font-size:10px;margin-top:1px}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="ico_generator">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 源图预览 -->
            <div class="panel u-mt-3" data-src-panel hidden>
              <div class="u-row u-gap-2 u-mb-2" style="justify-content:space-between;align-items:center">
                <span class="u-muted" style="font-size:var(--text-xs)" data-src-info></span>
                <div class="u-row u-gap-1">
                  <button class="btn is-sm is-ghost" data-act="crop">裁剪</button>
                  <button class="btn is-sm is-ghost" data-act="re-upload">重新上传</button>
                </div>
              </div>
              <div class="src-wrap">
                <canvas data-src-cv></canvas>
                <div class="crop-box" data-crop>
                  <div class="c-h nw"></div><div class="c-h ne"></div>
                  <div class="c-h sw"></div><div class="c-h se"></div>
                </div>
              </div>
              <div class="crop-bar" data-crop-bar hidden>
                <button class="btn is-sm is-primary" data-act="apply-crop">应用裁剪</button>
                <button class="btn is-sm" data-act="reset-crop">重置</button>
                <button class="btn is-sm is-ghost" data-act="cancel-crop">取消</button>
              </div>
            </div>

            <!-- 进度 -->
            <div data-progress hidden class="u-mt-3">
              <div style="height:6px;background:var(--bg-surface-2);border-radius:3px;overflow:hidden">
                <div data-bar style="height:100%;background:var(--color-brand);width:0%;transition:width .15s"></div>
              </div>
              <div class="u-muted u-mt-1" style="font-size:var(--text-xs)" data-prog-text></div>
            </div>

            <!-- 结果 -->
            <div data-result-panel hidden class="u-mt-3">
              <div class="panel">
                <h3 class="panel-title">生成结果</h3>
                <div class="icon-grid" data-icon-grid></div>
              </div>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <!-- 平台 -->
            <div class="panel">
              <h3 class="panel-title">目标平台</h3>
              <div class="plat-row" data-plats>
                <div class="plat-card active" data-plat="windows">Windows</div>
                <div class="plat-card" data-plat="macos">macOS</div>
                <div class="plat-card" data-plat="ios">iOS</div>
                <div class="plat-card" data-plat="android">Android</div>
                <div class="plat-card" data-plat="favicon">Favicon</div>
              </div>
            </div>

            <!-- 尺寸 -->
            <div class="panel">
              <h3 class="panel-title">
                图标尺寸
                <span class="u-row u-gap-1">
                  <button class="qbtn" data-qk="__all" style="font-size:10px">全选</button>
                  <button class="qbtn" data-qk="__none" style="font-size:10px">清空</button>
                </span>
              </h3>
              <div class="sz-grid" data-sizes></div>
              <div class="quick-row" data-quick></div>
            </div>

            <!-- 圆角 -->
            <div class="panel" data-radius-panel hidden>
              <h3 class="panel-title">圆角</h3>
              <div class="range-row">
                <input type="range" data-radius min="0" max="50" value="0">
                <span class="val" data-radius-val>0%</span>
              </div>
              <div class="rp-row" data-rp>
                <button data-rv="0" class="active">0%</button>
                <button data-rv="10">10%</button>
                <button data-rv="22">22%</button>
                <button data-rv="50">50%</button>
              </div>
            </div>

            <!-- 导出格式 -->
            <div class="panel" data-fmt-panel>
              <h3 class="panel-title">导出格式</h3>
              <div class="fmt-grid">
                <label class="fmt-card checked">
                  <input type="checkbox" data-fmt="icon" checked>
                  <div>
                    <div class="fc-title" data-fmt-label>ICO</div>
                    <div class="fc-desc">系统图标格式，支持多尺寸</div>
                  </div>
                </label>
                <label class="fmt-card checked">
                  <input type="checkbox" data-fmt="png" checked>
                  <div>
                    <div class="fc-title">PNG</div>
                    <div class="fc-desc">通用格式，适用于 Web 和设计</div>
                  </div>
                </label>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-act="generate" disabled>生成图标</button>
                <button class="btn" data-act="download-zip" hidden>下载 ZIP</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
