<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片水印 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <link rel="stylesheet" href="../_shared/watermark.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="watermark_images">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览 -->
          <div>
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP 等常见格式 · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>
            <div class="panel u-mt-3" data-preview hidden>
              <div class="preview-wrap"><canvas data-canvas></canvas></div>
            </div>
          </div>

          <!-- 右：水印设置 -->
          <aside>
            <!-- 水印类型 -->
            <div class="panel">
              <h3 class="panel-title">水印类型</h3>
              <div class="opt-row" data-type-opts>
                <button class="btn is-sm active" data-wm-type="text"><i data-lucide="type"></i> 文字水印</button>
                <button class="btn is-sm" data-wm-type="image"><i data-lucide="image"></i> 图片水印</button>
              </div>
            </div>

            <!-- 文字设置 -->
            <div class="panel" data-text-settings>
              <h3 class="panel-title">文字设置</h3>
              <div class="u-col u-gap-3">
                <input type="text" data-wm-text placeholder="请输入水印文字" class="input">
                <div class="range-row">
                  <label class="field-label">字号</label>
                  <input type="range" data-wm-fontsize min="12" max="72" value="24">
                  <span class="val" data-fontsize-val>24px</span>
                </div>
                <div class="u-row u-gap-2" style="align-items:center">
                  <label class="field-label" style="margin:0">颜色</label>
                  <input type="color" data-wm-color value="#000000">
                </div>
                <div class="range-row">
                  <label class="field-label">不透明度</label>
                  <input type="range" data-wm-opacity min="1" max="100" value="50">
                  <span class="val" data-opacity-val>50%</span>
                </div>
              </div>
            </div>

            <!-- 图片水印设置 -->
            <div class="panel" data-image-settings hidden>
              <h3 class="panel-title">图片水印</h3>
              <div class="wm-upload" data-wm-upload>
                <input type="file" accept="image/*" hidden data-wm-file>
                <div data-wm-upload-hint>
                  <i data-lucide="image" style="font-size:var(--text-lg);opacity:.4"></i>
                  <div class="u-muted" style="font-size:var(--text-xs)">点击上传水印图片</div>
                  <div class="hint">建议使用透明 PNG</div>
                </div>
                <img data-wm-preview hidden>
              </div>
              <div class="u-col u-gap-2 u-mt-3">
                <div class="range-row">
                  <label class="field-label">大小</label>
                  <input type="range" data-wm-size min="5" max="100" value="30">
                  <span class="val" data-size-val>30%</span>
                </div>
                <div class="range-row">
                  <label class="field-label">不透明度</label>
                  <input type="range" data-wm-img-opacity min="1" max="100" value="50">
                  <span class="val" data-img-opacity-val>50%</span>
                </div>
              </div>
            </div>

            <!-- 水印模式 -->
            <div class="panel">
              <h3 class="panel-title">水印模式</h3>
              <div class="opt-row" data-mode-opts>
                <button class="btn is-sm active" data-wm-mode="single">单个水印</button>
                <button class="btn is-sm" data-wm-mode="tile">铺满水印</button>
              </div>
            </div>

            <!-- 位置（单个模式） -->
            <div class="panel" data-pos-panel>
              <h3 class="panel-title">水印位置</h3>
              <div class="pos-grid" data-pos-grid>
                <button class="pos-cell" data-pos="top-left">↖</button>
                <button class="pos-cell" data-pos="top-center">↑</button>
                <button class="pos-cell" data-pos="top-right">↗</button>
                <button class="pos-cell" data-pos="middle-left">←</button>
                <button class="pos-cell active" data-pos="middle-center">●</button>
                <button class="pos-cell" data-pos="middle-right">→</button>
                <button class="pos-cell" data-pos="bottom-left">↙</button>
                <button class="pos-cell" data-pos="bottom-center">↓</button>
                <button class="pos-cell" data-pos="bottom-right">↘</button>
              </div>
            </div>

            <!-- 铺满设置 -->
            <div class="panel" data-tile-panel hidden>
              <h3 class="panel-title">铺满设置</h3>
              <div class="u-col u-gap-3">
                <div>
                  <label class="field-label">角度预设</label>
                  <div class="opt-row u-mt-1">
                    <button class="btn is-sm" data-angle="0">0°</button>
                    <button class="btn is-sm" data-angle="45">45°</button>
                    <button class="btn is-sm active" data-angle="315">-45°</button>
                    <button class="btn is-sm" data-angle="90">90°</button>
                  </div>
                </div>
                <div class="range-row">
                  <label class="field-label">角度</label>
                  <input type="range" data-tile-rotation min="0" max="360" value="315">
                  <span class="val" data-rotation-val>-45°</span>
                </div>
                <div class="range-row">
                  <label class="field-label">水平间距</label>
                  <input type="range" data-tile-sx min="100" max="300" value="150">
                  <span class="val" data-sx-val>150%</span>
                </div>
                <div class="range-row">
                  <label class="field-label">垂直间距</label>
                  <input type="range" data-tile-sy min="100" max="300" value="150">
                  <span class="val" data-sy-val>150%</span>
                </div>
              </div>
            </div>

            <!-- 导出 -->
            <div class="panel">
              <h3 class="panel-title">导出设置</h3>
              <div class="opt-row u-mb-3" data-format-opts>
                <button class="btn is-sm active" data-fmt="png">PNG</button>
                <button class="btn is-sm" data-fmt="jpg">JPG</button>
                <button class="btn is-sm" data-fmt="webp">WebP</button>
              </div>
              <div class="act-group">
                <button class="btn is-primary" data-action="download" disabled><i data-lucide="download"></i> 下载图片</button>
                <button class="btn is-ghost" data-action="clear" disabled><i data-lucide="trash-2"></i> 清空水印</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
