<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML 格式化 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="code_xml">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <!-- 顶部：导入 -->
          <div class="u-row u-gap-3 u-mb-4" style="flex-wrap:wrap;justify-content:flex-end;align-items:center">
            <label class="btn is-sm" style="cursor:pointer">
              <i data-lucide="upload"></i> 导入
              <input type="file" accept=".xml,text/xml,application/xml" hidden data-file>
            </label>
          </div>

          <!-- 编辑器 -->
          <textarea class="textarea u-mono" data-editor style="min-height:460px;font-size:var(--text-sm)" placeholder="粘贴 XML，或拖拽文件到此处…"></textarea>

          <!-- 底部：操作 + 统计 + 导出 -->
          <div class="u-row u-gap-3 u-mt-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
            <div class="btn-group">
              <button class="btn is-primary" type="button" data-action="format">格式化</button>
              <button class="btn" type="button" data-action="compress">压缩</button>
              <button class="btn" type="button" data-action="validate">校验</button>
            </div>
            <div class="u-row u-gap-3" style="align-items:center">
              <span class="u-muted" style="font-size:var(--text-sm)" data-size>0 B</span>
              <div class="btn-group">
                <button class="btn" type="button" data-action="copy">复制</button>
                <button class="btn" type="button" data-action="download">导出</button>
                <button class="btn is-ghost" type="button" data-action="clear">清空</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
