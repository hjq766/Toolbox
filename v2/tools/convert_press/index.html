<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>压力换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_press">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <div class="u-col u-gap-4">
            <div class="panel">
              <h3 class="panel-title">国际单位</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">巴 (bar)</label><div class="input-group"><span class="addon">bar</span><input class="input u-mono" type="text" data-unit="bar" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">千帕 (kPa)</label><div class="input-group"><span class="addon">kPa</span><input class="input u-mono" type="text" data-unit="kilopascal" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">百帕 (hPa)</label><div class="input-group"><span class="addon">hPa</span><input class="input u-mono" type="text" data-unit="hectopascal" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">毫巴 (mbar)</label><div class="input-group"><span class="addon">mbar</span><input class="input u-mono" type="text" data-unit="millibar" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">帕斯卡 (Pa)</label><div class="input-group"><span class="addon">Pa</span><input class="input u-mono" type="text" data-unit="pascal" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">大气 / 气象</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">标准大气压 (atm)</label><div class="input-group"><span class="addon">atm</span><input class="input u-mono" type="text" data-unit="atmosphere" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">毫米汞柱 (mmHg)</label><div class="input-group"><span class="addon">mmHg</span><input class="input u-mono" type="text" data-unit="mmhg" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">英寸汞柱 (inHg)</label><div class="input-group"><span class="addon">inHg</span><input class="input u-mono" type="text" data-unit="inhg" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">工程单位</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">公斤力/cm² (kgf/cm²)</label><div class="input-group"><span class="addon">kgf/cm²</span><input class="input u-mono" type="text" data-unit="kgf_cm2" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">公斤力/m² (kgf/m²)</label><div class="input-group"><span class="addon">kgf/m²</span><input class="input u-mono" type="text" data-unit="kgf_m2" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">毫米水柱 (mmH₂O)</label><div class="input-group"><span class="addon">mmH₂O</span><input class="input u-mono" type="text" data-unit="mmh2o" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">英制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">磅力/ft² (lbf/ft²)</label><div class="input-group"><span class="addon">lbf/ft²</span><input class="input u-mono" type="text" data-unit="lbf_ft2" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">磅力/in² (psi)</label><div class="input-group"><span class="addon">psi</span><input class="input u-mono" type="text" data-unit="psi" autocomplete="off"></div></div>
              </div>
            </div>
          </div>

          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <label class="field-label">选择单位</label>
              <select class="select u-mb-3" data-quick-unit>
                <option value="atmosphere">标准大气压 (atm)</option>
                <option value="bar">巴 (bar)</option>
                <option value="kilopascal">千帕 (kPa)</option>
                <option value="pascal">帕斯卡 (Pa)</option>
                <option value="psi">psi</option>
                <option value="mmhg">毫米汞柱 (mmHg)</option>
              </select>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="10">10</button>
                <button class="btn is-sm" data-quick="100">100</button>
                <button class="btn is-sm" data-quick="1000">1000</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row"><input type="range" min="2" max="10" value="6" data-precision><span class="val" data-precision-val>6 位</span></div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy-all"><i data-lucide="copy"></i> 复制全部</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
            <div class="panel"><p class="hint">在任意输入框输入数值，其它单位自动换算。</p></div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
