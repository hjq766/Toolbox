<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机号归属地 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="phone_localtion">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <div class="field" style="max-width:460px">
            <label class="field-label" for="phone">手机号码</label>
            <div class="input-group">
              <input class="input u-mono" id="phone" type="text" data-phone placeholder="请输入 11 位手机号" maxlength="11" autocomplete="off">
              <button class="btn is-primary" type="button" data-action="query">查询</button>
            </div>
            <span class="field-hint">支持中国大陆 11 位手机号码</span>
          </div>
        </div>

        <!-- 结果 -->
        <div class="panel" data-result hidden>
          <h3 class="panel-title">查询结果</h3>
          <div class="stat-grid">
            <div class="stat">
              <div class="stat-label">号码</div>
              <div class="stat-value u-mono" data-r-number style="font-size:var(--text-lg)">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">号段</div>
              <div class="stat-value" data-r-segment style="font-size:var(--text-lg)">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">归属地</div>
              <div class="stat-value" data-r-province style="font-size:var(--text-lg);color:var(--color-brand)">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">运营商</div>
              <div class="stat-value" data-r-carrier style="font-size:var(--text-lg)">—</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
