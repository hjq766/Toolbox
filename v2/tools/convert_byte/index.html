<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字节换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_byte">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <div class="u-col u-gap-4">
            <div class="panel">
              <h3 class="panel-title">数据存储</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">比特 (bit)</label><div class="input-group"><span class="addon">bit</span><input class="input u-mono" type="text" data-unit="b" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">字节 (B)</label><div class="input-group"><span class="addon">B</span><input class="input u-mono" type="text" data-unit="B" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">千字节 (KB)</label><div class="input-group"><span class="addon">KB</span><input class="input u-mono" type="text" data-unit="KB" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">兆字节 (MB)</label><div class="input-group"><span class="addon">MB</span><input class="input u-mono" type="text" data-unit="MB" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">吉字节 (GB)</label><div class="input-group"><span class="addon">GB</span><input class="input u-mono" type="text" data-unit="GB" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">太字节 (TB)</label><div class="input-group"><span class="addon">TB</span><input class="input u-mono" type="text" data-unit="TB" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">拍字节 (PB)</label><div class="input-group"><span class="addon">PB</span><input class="input u-mono" type="text" data-unit="PB" autocomplete="off"></div></div>
              </div>
            </div>
          </div>

          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <label class="field-label">选择单位</label>
              <select class="select u-mb-3" data-quick-unit>
                <option value="MB">兆字节 (MB)</option>
                <option value="GB">吉字节 (GB)</option>
                <option value="TB">太字节 (TB)</option>
                <option value="KB">千字节 (KB)</option>
                <option value="B">字节 (B)</option>
              </select>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="64">64</button>
                <button class="btn is-sm" data-quick="256">256</button>
                <button class="btn is-sm" data-quick="1024">1024</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row"><input type="range" min="2" max="10" value="6" data-precision><span class="val" data-precision-val>6 位</span></div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy-all"><i data-lucide="copy"></i> 复制全部</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
            <div class="panel"><p class="hint">采用二进制换算（1 KB = 1024 B）。</p></div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
