<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片色板提取 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <script src="../../public/vendor/color-thief.umd.js" defer></script>
  <style>
    .preview-wrap{position:relative;background:var(--bg-surface-2);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:260px}
    .preview-wrap canvas{max-width:100%;max-height:400px;display:block}
    .color-list{display:flex;flex-wrap:wrap;gap:var(--space-2)}
    .color-card{display:flex;align-items:center;gap:var(--space-2);padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:box-shadow .15s}
    .color-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .color-swatch{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);flex-shrink:0}
    .color-val{font-size:var(--text-sm);font-family:var(--font-mono,monospace)}
    .color-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:0 2px;line-height:1}
    .color-del:hover{color:var(--color-danger,#ef4444)}
    aside .opt-row .btn{text-align:center}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_color">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览 -->
            <div class="panel u-mt-3" data-preview-section hidden>
              <div class="u-row u-gap-2 u-mb-2" style="justify-content:space-between;align-items:center">
                <div class="u-row u-gap-1">
                  <button class="btn is-sm" data-mode="manual" title="手动取色">🎯 取色</button>
                  <button class="btn is-sm" data-mode="selection" title="选区提取">⬚ 选区</button>
                </div>
                <button class="btn is-sm is-ghost" data-action="delete-img" title="删除图片">✕</button>
              </div>
              <div class="preview-wrap">
                <canvas data-canvas></canvas>
              </div>
            </div>

            <!-- 色板 -->
            <div class="panel u-mt-3" data-colors-section hidden>
              <div class="u-row u-gap-2 u-mb-2" style="justify-content:space-between;align-items:center">
                <h3 class="panel-title" style="margin:0">提取色板</h3>
                <div class="u-row u-gap-1">
                  <button class="btn is-sm is-ghost" data-action="export-img">导出图片</button>
                  <button class="btn is-sm is-ghost" data-action="export-json">导出 JSON</button>
                  <button class="btn is-sm is-ghost" data-action="clear-colors">清空</button>
                </div>
              </div>
              <div class="color-list" data-color-list></div>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">取色数量</h3>
              <div class="opt-row" data-count-opts>
                <button class="btn is-sm" data-count="3">3</button>
                <button class="btn is-sm active" data-count="5">5</button>
                <button class="btn is-sm" data-count="8">8</button>
                <button class="btn is-sm" data-count="12">12</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">排序方式</h3>
              <div class="opt-row" data-sort-opts>
                <button class="btn is-sm active" data-sort="default">默认</button>
                <button class="btn is-sm" data-sort="brightness">亮度</button>
                <button class="btn is-sm" data-sort="hue">色相</button>
                <button class="btn is-sm" data-sort="saturation">饱和度</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">颜色格式</h3>
              <div class="opt-row" data-format-opts>
                <button class="btn is-sm active" data-format="hex">HEX</button>
                <button class="btn is-sm" data-format="rgb">RGB</button>
                <button class="btn is-sm" data-format="hsl">HSL</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
