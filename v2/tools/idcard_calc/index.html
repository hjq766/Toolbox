<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身份证查询 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <script src="../../public/vendor/idcard_area.js"></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="idcard_calc">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <!-- 输入 -->
        <div class="panel">
          <div class="field">
            <label class="field-label" for="idIn">身份证号码（每行一个）</label>
            <textarea class="textarea u-mono" id="idIn" data-input placeholder="请输入身份证号码，每行一个…" style="min-height:160px"></textarea>
            <input type="file" accept=".txt,.csv,.xlsx,.xls" hidden data-file>
          </div>
          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" type="button" data-action="calc"><i data-lucide="play"></i> 计算</button>
            <button class="btn" type="button" data-action="import"><i data-lucide="upload"></i> 导入文件</button>
            <button class="btn is-ghost" type="button" data-action="clear"><i data-lucide="trash-2"></i> 清空</button>
          </div>
        </div>

        <!-- 结果表格 -->
        <div class="panel" data-result-panel hidden>
          <h3 class="panel-title u-row u-between">
            <span>计算结果 <span class="field-hint" data-result-count></span></span>
            <button class="btn is-sm" type="button" data-action="export"><i data-lucide="table"></i> 导出 Excel</button>
          </h3>
          <div style="overflow-x:auto">
            <table class="data-table" data-table>
              <thead><tr>
                <th>序号</th>
                <th>身份证号码</th>
                <th>验证</th>
                <th>地区</th>
                <th>出生日期</th>
                <th>性别</th>
                <th>年龄</th>
                <th>生肖</th>
                <th>星座</th>
              </tr></thead>
              <tbody data-tbody></tbody>
            </table>
          </div>
          <div class="u-row u-gap-3 u-mt-4" data-pager style="justify-content:center"></div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
