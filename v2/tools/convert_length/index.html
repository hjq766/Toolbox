<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长度换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_length">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <!-- 左：换算区 -->
          <div class="u-col u-gap-4">
            <!-- 公制 -->
            <div class="panel">
              <h3 class="panel-title">公制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field">
                  <label class="field-label">千米 (km)</label>
                  <div class="input-group">
                    <span class="addon">km</span>
                    <input class="input u-mono" type="text" data-unit="km" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">米 (m)</label>
                  <div class="input-group">
                    <span class="addon">m</span>
                    <input class="input u-mono" type="text" data-unit="m" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">分米 (dm)</label>
                  <div class="input-group">
                    <span class="addon">dm</span>
                    <input class="input u-mono" type="text" data-unit="dm" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">厘米 (cm)</label>
                  <div class="input-group">
                    <span class="addon">cm</span>
                    <input class="input u-mono" type="text" data-unit="cm" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">毫米 (mm)</label>
                  <div class="input-group">
                    <span class="addon">mm</span>
                    <input class="input u-mono" type="text" data-unit="mm" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">微米 (μm)</label>
                  <div class="input-group">
                    <span class="addon">μm</span>
                    <input class="input u-mono" type="text" data-unit="um" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>

            <!-- 英制 -->
            <div class="panel">
              <h3 class="panel-title">英制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field">
                  <label class="field-label">英寸 (in)</label>
                  <div class="input-group">
                    <span class="addon">in</span>
                    <input class="input u-mono" type="text" data-unit="in" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">英尺 (ft)</label>
                  <div class="input-group">
                    <span class="addon">ft</span>
                    <input class="input u-mono" type="text" data-unit="ft" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">码 (yd)</label>
                  <div class="input-group">
                    <span class="addon">yd</span>
                    <input class="input u-mono" type="text" data-unit="yd" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">英里 (mi)</label>
                  <div class="input-group">
                    <span class="addon">mi</span>
                    <input class="input u-mono" type="text" data-unit="mi" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">海里 (nmi)</label>
                  <div class="input-group">
                    <span class="addon">nmi</span>
                    <input class="input u-mono" type="text" data-unit="nmi" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>

            <!-- 中国市制 -->
            <div class="panel">
              <h3 class="panel-title">中国市制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field">
                  <label class="field-label">市里 (里)</label>
                  <div class="input-group">
                    <span class="addon">里</span>
                    <input class="input u-mono" type="text" data-unit="li" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">市尺 (尺)</label>
                  <div class="input-group">
                    <span class="addon">尺</span>
                    <input class="input u-mono" type="text" data-unit="chi" autocomplete="off">
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">市寸 (寸)</label>
                  <div class="input-group">
                    <span class="addon">寸</span>
                    <input class="input u-mono" type="text" data-unit="cun" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 右：侧栏 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <label class="field-label">选择单位</label>
              <select class="select u-mb-3" data-quick-unit>
                <option value="m">米 (m)</option>
                <option value="km">千米 (km)</option>
                <option value="cm">厘米 (cm)</option>
                <option value="mm">毫米 (mm)</option>
                <option value="in">英寸 (in)</option>
                <option value="ft">英尺 (ft)</option>
                <option value="mi">英里 (mi)</option>
                <option value="chi">市尺 (尺)</option>
              </select>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="10">10</button>
                <button class="btn is-sm" data-quick="100">100</button>
                <button class="btn is-sm" data-quick="1000">1000</button>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row">
                <input type="range" min="2" max="10" value="6" data-precision>
                <span class="val" data-precision-val>6 位</span>
              </div>
            </div>

            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy-all"><i data-lucide="copy"></i> 复制全部</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>

            <div class="panel">
              <p class="hint">在任意输入框输入数值，其它单位自动换算。</p>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
