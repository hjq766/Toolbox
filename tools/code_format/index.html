<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码格式化 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <script src="../../public/vendor/beautify.min.js" defer></script>
  <script src="../../public/vendor/beautify-css.min.js" defer></script>
  <script src="../../public/vendor/beautify-html.min.js" defer></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="code_format">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <!-- 工具栏第一行：语言 -->
          <div class="u-row u-gap-3 u-mb-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
            <div class="tabs" role="tablist">
              <button class="tab-btn is-active" data-lang="auto">自动</button>
              <button class="tab-btn" data-lang="javascript">JS</button>
              <button class="tab-btn" data-lang="css">CSS</button>
              <button class="tab-btn" data-lang="html">HTML</button>
              <button class="tab-btn" data-lang="python">PY</button>
              <button class="tab-btn" data-lang="sql">SQL</button>
            </div>
            <div class="u-row u-gap-3" style="align-items:center">
              <div class="tabs" role="tablist">
                <button class="tab-btn is-active" data-style="default">默认</button>
                <button class="tab-btn" data-style="compact">紧凑</button>
              </div>
              <label class="btn is-sm" style="cursor:pointer">
                <i data-lucide="upload"></i> 导入
                <input type="file" accept=".js,.css,.html,.htm,.py,.sql,.php,.java,.cpp,.c,.rb,.ts,.jsx,.tsx" hidden data-file>
              </label>
            </div>
          </div>

          <!-- 编辑器 -->
          <textarea class="textarea u-mono" data-editor style="min-height:460px;font-size:var(--text-sm)" placeholder="粘贴代码，或拖拽文件到此处…"></textarea>

          <!-- 底部：操作 + 统计 -->
          <div class="u-row u-gap-3 u-mt-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
            <div class="btn-group">
              <button class="btn is-primary" type="button" data-action="format">格式化</button>
              <button class="btn" type="button" data-action="compress">压缩</button>
              <button class="btn" type="button" data-action="remove-comments">移除注释</button>
            </div>
            <div class="u-row u-gap-3" style="align-items:center">
              <span class="u-muted" style="font-size:var(--text-sm)">
                <span data-stat="lang">-</span> · <span data-stat="lines">0 行</span> · <span data-stat="size">0 B</span>
              </span>
              <div class="btn-group">
                <button class="btn" type="button" data-action="copy">复制</button>
                <button class="btn" type="button" data-action="download">导出</button>
                <button class="btn is-ghost" type="button" data-action="clear">清空</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
