<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 实时预览 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="./tool.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="html_preview">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel u-row u-between" style="flex-wrap:wrap;gap:var(--space-3)">
          <div class="tabs" role="tablist" aria-label="设备切换">
            <button class="tab-btn is-active" data-device="desktop" type="button">桌面</button>
            <button class="tab-btn" data-device="laptop" type="button">笔电</button>
            <button class="tab-btn" data-device="tablet" type="button">平板</button>
            <button class="tab-btn" data-device="mobile" type="button">手机</button>
          </div>
          <div class="btn-group">
            <button class="btn is-sm" type="button" data-export="html">导出 HTML</button>
            <button class="btn is-sm" type="button" data-export="image">导出图片</button>
            <button class="btn is-sm" type="button" data-export="pdf">导出 PDF</button>
          </div>
        </div>

        <div class="hp-split">
          <div class="hp-editors">
            <div class="panel hp-editor cm-embed">
              <div class="hp-editor-head"><span class="hp-dot" style="background:#e44d26"></span>HTML</div>
              <textarea class="hp-textarea" data-editor="html" spellcheck="false" placeholder="<!-- HTML -->"></textarea>
            </div>
            <div class="panel hp-editor cm-embed">
              <div class="hp-editor-head"><span class="hp-dot" style="background:#1572b6"></span>CSS</div>
              <textarea class="hp-textarea" data-editor="css" spellcheck="false" placeholder="/* CSS */"></textarea>
            </div>
            <div class="panel hp-editor cm-embed">
              <div class="hp-editor-head"><span class="hp-dot" style="background:#f0db4f"></span>JavaScript</div>
              <textarea class="hp-textarea" data-editor="js" spellcheck="false" placeholder="// JavaScript"></textarea>
            </div>
          </div>

          <div class="panel preview-stage" data-stage data-device="desktop">
            <iframe class="preview-frame" data-frame title="代码预览"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
