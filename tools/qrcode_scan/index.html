<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码识别 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .scan-preview img{max-width:100%;border-radius:var(--radius-md);display:block;margin:0 auto}
    .result-rows{display:flex;flex-direction:column;gap:var(--space-2)}
    .result-rows .rr{display:flex;gap:var(--space-3);font-size:var(--text-sm);padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle)}
    .result-rows .rr-label{color:var(--fg-muted);min-width:56px;flex-shrink:0}
    .result-rows .rr-val{color:var(--fg-strong);word-break:break-all}
    .result-rows .rr-val a{color:var(--color-brand)}
  </style>
  <script src="../../public/vendor/jsQR.min.js" defer></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="qrcode_scan">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:340px">
          <!-- 左：输入源 -->
          <div class="u-col u-gap-3">
            <div class="panel">
              <div>
                <label class="u-col u-gap-2" data-drop style="border:2px dashed var(--border-base);border-radius:var(--radius-md);align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4)">
                  <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
                  <div class="u-strong">点击或拖拽图片到此处</div>
                  <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP · 支持粘贴上传</div>
                  <input type="file" accept="image/*" hidden data-file>
                </label>
                <div class="scan-preview u-mt-3" data-preview hidden>
                  <img data-img>
                  <div class="u-row u-gap-2 u-mt-2" style="justify-content:center">
                    <button class="btn is-sm is-ghost" type="button" data-action="re-upload"><i data-lucide="refresh-cw"></i> 重新选择</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 右：结果 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">识别结果</h3>
              <div data-no-result>
                <div class="u-muted u-text-center" style="padding:var(--space-6) 0">上传图片即可识别</div>
              </div>
              <div data-result hidden>
                <div class="u-row u-gap-2 u-mb-3" style="align-items:center">
                  <span class="badge is-brand" data-result-type></span>
                  <span class="u-muted" style="font-size:var(--text-xs)" data-result-time></span>
                </div>
                <div class="result-rows" data-result-body></div>
                <div class="sep u-mt-3 u-mb-2"></div>
                <label class="field-label">原始内容</label>
                <textarea class="textarea u-mono" data-raw-text rows="3" readonly></textarea>
                <div class="act-group u-mt-3">
                  <button class="btn is-primary" type="button" data-action="copy"><i data-lucide="copy"></i> 复制内容</button>
                  <button class="btn is-ghost" type="button" data-action="open-url" hidden><i data-lucide="external-link"></i> 打开链接</button>
                </div>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
