<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重量换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_weight">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <div class="u-col u-gap-4">
            <div class="panel">
              <h3 class="panel-title">公制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">吨 (t)</label><div class="input-group"><span class="addon">t</span><input class="input u-mono" type="text" data-unit="t" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">千克 (kg)</label><div class="input-group"><span class="addon">kg</span><input class="input u-mono" type="text" data-unit="kg" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">克 (g)</label><div class="input-group"><span class="addon">g</span><input class="input u-mono" type="text" data-unit="g" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">毫克 (mg)</label><div class="input-group"><span class="addon">mg</span><input class="input u-mono" type="text" data-unit="mg" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">克拉 (ct)</label><div class="input-group"><span class="addon">ct</span><input class="input u-mono" type="text" data-unit="ct" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">英制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">磅 (lb)</label><div class="input-group"><span class="addon">lb</span><input class="input u-mono" type="text" data-unit="lb" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">盎司 (oz)</label><div class="input-group"><span class="addon">oz</span><input class="input u-mono" type="text" data-unit="oz" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">英石 (st)</label><div class="input-group"><span class="addon">st</span><input class="input u-mono" type="text" data-unit="st" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">中国市制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">市斤 (斤)</label><div class="input-group"><span class="addon">斤</span><input class="input u-mono" type="text" data-unit="jin" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">市两 (两)</label><div class="input-group"><span class="addon">两</span><input class="input u-mono" type="text" data-unit="liang" autocomplete="off"></div></div>
              </div>
            </div>
          </div>

          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <label class="field-label">选择单位</label>
              <select class="select u-mb-3" data-quick-unit>
                <option value="kg">千克 (kg)</option>
                <option value="g">克 (g)</option>
                <option value="lb">磅 (lb)</option>
                <option value="jin">市斤 (斤)</option>
                <option value="t">吨 (t)</option>
                <option value="oz">盎司 (oz)</option>
              </select>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="10">10</button>
                <button class="btn is-sm" data-quick="100">100</button>
                <button class="btn is-sm" data-quick="1000">1000</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row"><input type="range" min="2" max="10" value="6" data-precision><span class="val" data-precision-val>6 位</span></div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy-all"><i data-lucide="copy"></i> 复制全部</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
            <div class="panel"><p class="hint">在任意输入框输入数值，其它单位自动换算。</p></div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
