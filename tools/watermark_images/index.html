<body data-page="tool" data-base-path="../../" data-tool-slug="watermark_images">
  <div class="page-shell"><main class="page-main"><div class="container">

      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <div>
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>

            <div class="panel u-mt-3" data-preview hidden>
              <div class="u-row u-mb-3" style="justify-content:space-between;align-items:center">
                <span class="u-muted u-text-xs" data-img-info></span>
                <button class="btn is-sm is-ghost" type="button" data-img-delete><i data-lucide="x"></i></button>
              </div>
              <div class="preview-wrap"><canvas data-canvas></canvas></div>
            </div>
          </div>

          <aside class="is-inactive">
            <div class="panel">
              <h3 class="panel-title">水印设置</h3>
              <div class="tabs" data-type-opts style="width:100%">
                <button class="tab-btn is-active" data-wm-type="text">文字水印</button>
                <button class="tab-btn" data-wm-type="image">图片水印</button>
              </div>
              <div data-text-settings class="u-mt-3">
                <div class="u-col u-gap-3">
                  <input type="text" data-wm-text placeholder="请输入水印文字" class="input">
                  <div class="range-row">
                    <label class="field-label">字号</label>
                    <input type="range" data-wm-fontsize min="12" max="72" value="24">
                    <span class="val" data-fontsize-val>24px</span>
                  </div>
                  <div class="u-row u-gap-2" style="align-items:center">
                    <label class="field-label" style="margin:0">颜色</label>
                    <input type="color" data-wm-color value="#000000">
                  </div>
                  <div class="range-row">
                    <label class="field-label">不透明度</label>
                    <input type="range" data-wm-opacity min="1" max="100" value="50">
                    <span class="val" data-opacity-val>50%</span>
                  </div>
                </div>
              </div>
              <div data-image-settings hidden class="u-mt-3">
                <div class="wm-upload upload-panel is-inner is-compact" data-wm-upload>
                  <input type="file" accept="image/*" hidden data-wm-file>
                  <div data-wm-upload-hint class="u-col u-items-center">
                    <i data-lucide="image" style="font-size:var(--text-lg);opacity:.4"></i>
                    <div class="u-muted u-text-xs">点击上传水印图片</div>

                  <img data-wm-preview hidden>
                </div>

                  <div class="range-row">
                    <label class="field-label">大小</label>
                    <input type="range" data-wm-size min="5" max="100" value="30">
                    <span class="val" data-size-val>30%</span>
                  </div>
                  <div class="range-row">
                    <label class="field-label">不透明度</label>
                    <input type="range" data-wm-img-opacity min="1" max="100" value="50">
                    <span class="val" data-img-opacity-val>50%</span>
                  </div>
                </div>
              </div>
            </div>

              <h3 class="panel-title">水印位置</h3>
              <div class="tabs" data-mode-opts style="width:100%">
                <button class="tab-btn is-active" data-wm-mode="single">单个水印</button>
                <button class="tab-btn" data-wm-mode="tile">铺满水印</button>
              </div>
              <div data-pos-panel class="u-mt-3">
                <div class="pos-grid" data-pos-grid>
                  <button class="pos-cell" data-pos="top-left">↖</button>
                  <button class="pos-cell" data-pos="top-center">↑</button>
                  <button class="pos-cell" data-pos="top-right">↗</button>
                  <button class="pos-cell" data-pos="middle-left">←</button>
                  <button class="pos-cell active" data-pos="middle-center">●</button>
                  <button class="pos-cell" data-pos="middle-right">→</button>
                  <button class="pos-cell" data-pos="bottom-left">↙</button>
                  <button class="pos-cell" data-pos="bottom-center">↓</button>
                  <button class="pos-cell" data-pos="bottom-right">↘</button>
                </div>
              </div>

                <div class="u-col u-gap-3">
                  <div>
                    <label class="field-label">角度预设</label>
                    <div class="opt-row u-mt-1">
                      <button class="btn is-sm" data-angle="0">0°</button>
                      <button class="btn is-sm" data-angle="45">45°</button>
                      <button class="btn is-sm active" data-angle="315">-45°</button>
                      <button class="btn is-sm" data-angle="90">90°</button>
                    </div>
                  </div>
                  <div class="range-row">
                    <label class="field-label">角度</label>
                    <input type="range" data-tile-rotation min="0" max="360" value="315">
                    <span class="val" data-rotation-val>-45°</span>
                  </div>
                  <div class="range-row">
                    <label class="field-label">水平间距</label>
                    <input type="range" data-tile-sx min="100" max="300" value="150">
                    <span class="val" data-sx-val>150%</span>
                  </div>
                  <div class="range-row">
                    <label class="field-label">垂直间距</label>
                    <input type="range" data-tile-sy min="100" max="300" value="150">
                    <span class="val" data-sy-val>150%</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">导出设置</h3>
              <div class="opt-row u-mb-3" data-format-opts>

                <button class="btn is-sm" data-fmt="webp">WebP</button>
              </div>

                  </div>
                </div>
              </div>
            </div>
