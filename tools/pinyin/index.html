<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼音转换 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <script src="../../public/vendor/pinyin_dict.js"></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="pinyin">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-2">
          <!-- 输入 -->
          <div class="panel">
            <div class="u-row u-between u-mb-4" style="align-items:center;min-height:32px">
              <label class="field-label" for="pyIn" style="margin:0">汉字文本</label>
              <span class="field-hint" data-count>0 字</span>
            </div>
            <div class="field">
              <textarea class="textarea" id="pyIn" data-input placeholder="输入汉字，如：千里之行始于足下" style="min-height:220px"></textarea>
            </div>
            <div class="u-mt-4">
              <button class="btn is-ghost is-sm" type="button" data-action="clear"><i data-lucide="trash-2"></i> 清空</button>
            </div>
          </div>

          <!-- 输出 -->
          <div class="panel">
            <div class="grid-chips u-mb-4">
              <div class="chip is-active" data-opt="tone">带声调</div>
              <div class="chip" data-opt="first">仅首字母</div>
              <div class="chip" data-opt="upper">大写</div>
            </div>
            <div class="field">
              <div class="pinyin-result" data-result></div>
            </div>
            <div class="u-mt-4">
              <button class="btn is-primary is-sm" type="button" data-action="copy"><i data-lucide="copy"></i> 复制结果</button>
            </div>
          </div>
        </div>

        <style>
          .pinyin-result {
            display: flex; flex-wrap: wrap; gap: var(--space-2);
            padding: var(--space-4); min-height: 220px;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            background: var(--bg-surface-2); align-content: flex-start;
          }
          .pinyin-result .py-item {
            display: inline-flex; flex-direction: column; align-items: center; padding: 2px 6px;
          }
          .pinyin-result .py-ruby { font-size: var(--text-xs); color: var(--fg-muted); }
          .pinyin-result .py-char { font-size: var(--text-base); }
        </style>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
