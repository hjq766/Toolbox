<body data-page="tool" data-base-path="../../" data-tool-slug="regex_test">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel u-mb-3">
          <!-- 正则输入 -->
          <div class="field u-mb-3">
            <label class="field-label">正则表达式</label>
            <div class="regex-input">
              <span class="slash">/</span>
              <input data-input="pattern" placeholder="输入正则表达式" autocomplete="off" spellcheck="false">
              <span class="slash">/</span>
              <input class="flags" data-input="flags" value="g" placeholder="g" maxlength="6" style="width:48px">

          </div>
          <!-- Flags -->
          <div class="u-row u-gap-3 u-mb-3" style="flex-wrap:wrap">
            <label class="checkbox"><input type="checkbox" data-flag="g" checked> g (全局)</label>
            <label class="checkbox"><input type="checkbox" data-flag="i"> i (忽略大小写)</label>
            <label class="checkbox"><input type="checkbox" data-flag="m"> m (多行)</label>
            <label class="checkbox"><input type="checkbox" data-flag="s"> s (dotAll)</label>
          </div>

          <div class="field u-mb-3">
            <label class="field-label">测试文本</label>
            <div data-highlight-wrap style="position:relative">
              <textarea class="textarea u-mono" data-input="text" rows="6" placeholder="输入要匹配的文本" spellcheck="false"></textarea>
            </div>
          </div>
          <!-- 错误 -->
          <div class="field-error u-mb-2" data-error hidden></div>
          <!-- 匹配统计 -->
          <div class="u-row u-between u-mb-3">
            <span class="u-muted" data-match-info>0 个匹配</span>

          </div>
          <!-- 匹配结果 -->
          <div data-matches></div>
        </div>

        <!-- 常用正则 -->
        <div class="panel">
          <h3 class="panel-title">常用正则速查</h3>
          <div class="preset-grid" data-presets></div>
        </div>

      </div>
    </div>
