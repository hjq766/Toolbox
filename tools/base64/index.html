<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 编码 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="base64">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <!-- Tab 切换 -->
        <div class="tabs" data-tabs>
          <button class="tab-btn is-active" type="button" data-tab="text">文本编码</button>
          <button class="tab-btn" type="button" data-tab="image">图片编码</button>
        </div>

        <!-- 文本编码 -->
        <div class="panel" data-pane="text">
          <div class="grid grid-2">
            <div class="field">
              <label class="field-label">原文本</label>
              <textarea class="textarea u-mono" data-text-in placeholder="输入需要编码的文本..." style="min-height:220px"></textarea>
            </div>
            <div class="field">
              <label class="field-label">Base64 结果</label>
              <textarea class="textarea u-mono" data-text-out placeholder="编码结果 / 粘贴 Base64 解码..." style="min-height:220px"></textarea>
            </div>
          </div>
          <div class="u-row u-gap-3 u-mt-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
            <div class="u-row u-gap-2">
              <button class="btn is-primary" type="button" data-action="encode">编码 →</button>
              <button class="btn is-primary" type="button" data-action="decode">← 解码</button>
            </div>
            <div class="btn-group">
              <button class="btn" type="button" data-action="copy-text">复制</button>
              <button class="btn is-ghost" type="button" data-action="clear-text">清空</button>
            </div>
          </div>
        </div>

        <!-- 图片编码 -->
        <div data-pane="image" hidden>
          <!-- 上传区 -->
          <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-6);margin:0">
            <i data-lucide="upload" class="u-muted" style="width:1.8rem;height:1.8rem"></i>
            <div class="u-strong">拖拽图片到此处，或点击选择</div>
            <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / GIF / WebP / SVG · 支持粘贴上传</div>
            <input type="file" accept="image/*" hidden data-file>
          </label>

          <!-- Base64 结果 + 预览 左右布局 -->
          <div class="panel u-mt-4">
            <div class="grid grid-2" style="align-items:start">
              <div class="field">
                <label class="field-label">Base64 结果</label>
                <textarea class="textarea u-mono" data-img-out placeholder="图片 Base64 编码 / 粘贴 Base64 还原预览..." style="min-height:260px"></textarea>
              </div>
              <div class="field">
                <label class="field-label">图片预览</label>
                <div data-preview-wrap style="display:flex;align-items:center;justify-content:center;min-height:120px;padding:var(--space-3);border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface-2)">
                  <div class="u-muted" data-preview-hint style="font-size:var(--text-sm)">上传图片或从 Base64 还原</div>
                  <img data-preview hidden style="max-width:100%;max-height:220px;border-radius:var(--radius-sm)">
                </div>
                <div class="u-muted u-mt-2" style="font-size:var(--text-xs)" data-img-info></div>
              </div>
            </div>
            <div class="u-row u-gap-3 u-mt-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
              <button class="btn is-primary" type="button" data-action="decode-img">从 Base64 还原预览</button>
              <div class="btn-group">
                <button class="btn" type="button" data-action="copy-img">复制</button>
                <button class="btn is-ghost" type="button" data-action="clear-img">清空</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
