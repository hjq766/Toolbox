<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多宫格切图 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <script src="../../public/vendor/jszip.min.js" defer></script>
  <style>
    .preview-wrap{position:relative;background:var(--bg-surface-2);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:300px}
    .preview-wrap canvas{max-width:100%;max-height:500px;display:block}
    .grid-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .custom-group{display:none;margin-top:var(--space-2)}
    .custom-group.show{display:flex;gap:var(--space-2);align-items:center}
    .custom-group input{width:56px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center;background:var(--bg-surface);color:var(--text);font-size:var(--text-sm)}
    .preset-row{display:flex;gap:var(--space-1);flex-wrap:wrap}
    .preset-row .btn.active{background:var(--color-brand);color:#fff}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_cut">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览 -->
            <div class="panel u-mt-3" data-preview hidden>
              <div class="u-row u-gap-2 u-mb-2" style="justify-content:flex-end">
                <button class="btn is-sm is-ghost" data-action="delete">删除图片</button>
              </div>
              <div class="preview-wrap">
                <canvas data-canvas></canvas>
                <div class="grid-overlay" data-grid-lines></div>
              </div>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">宫格预设</h3>
              <div class="opt-row" data-presets>
                <button class="btn is-sm" data-rows="2" data-cols="2">2×2</button>
                <button class="btn is-sm active" data-rows="3" data-cols="3">3×3</button>
                <button class="btn is-sm" data-rows="4" data-cols="4">4×4</button>
                <button class="btn is-sm" data-rows="2" data-cols="3">2×3</button>
                <button class="btn is-sm" data-rows="3" data-cols="2">3×2</button>
                <button class="btn is-sm" data-custom>自定义</button>
              </div>
              <div class="custom-group" data-custom-group>
                <span style="font-size:var(--text-sm)">行</span>
                <input type="number" data-custom-rows value="3" min="1" max="10">
                <span style="font-size:var(--text-sm)">列</span>
                <input type="number" data-custom-cols value="3" min="1" max="10">
                <button class="btn is-sm is-primary" data-action="apply-custom">确定</button>
              </div>
              <div class="hint">选择切割的行列数，或自定义尺寸</div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="cut" disabled>切割并下载 ZIP</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
