<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界时间 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <style>
    .wt-hero {
      background: linear-gradient(135deg, var(--color-brand), hsl(200 90% 55%));
      color: #fff; border-radius: var(--radius-lg); padding: var(--space-6) var(--space-4);
      text-align: center;
    }
    .wt-hero-time { font-size: var(--text-4xl); font-weight: 700; font-feature-settings: 'tnum'; letter-spacing: .04em; }
    .wt-card { text-align: center; }
    .wt-card:hover { border-color: var(--color-brand); }
    .wt-card .card-body { padding: var(--space-3); }
    .wt-card-time { font-size: var(--text-xl); font-weight: 700; font-feature-settings: 'tnum'; }
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="worldtime">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <!-- 北京时间 -->
        <div class="wt-hero">
          <div style="font-size:var(--text-sm);opacity:.75;margin-bottom:var(--space-1)">北京时间 (UTC+8)</div>
          <div class="wt-hero-time" data-bj-time>--:--:--</div>
          <div style="font-size:var(--text-sm);opacity:.7;margin-top:var(--space-1)" data-bj-date>----年--月--日</div>
        </div>

        <!-- 世界城市 -->
        <div class="grid grid-auto-sm" data-grid></div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
