<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本去重 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="text_deduplicate">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">
        <div class="panel">
          <div class="grid grid-2">
            <div class="field">
              <label class="field-label">原始文本</label>
              <textarea class="textarea" data-input placeholder="每行一条；将按行去重。"></textarea>
            </div>
            <div class="field">
              <label class="field-label">去重结果 <span class="u-muted" data-count></span></label>
              <textarea class="textarea" data-output readonly></textarea>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3 class="panel-title">选项</h3>
          <div class="grid grid-2 u-gap-3">
            <label class="checkbox"><input type="checkbox" data-opt="trim" checked> 去除首尾空白后再比较</label>
            <label class="checkbox"><input type="checkbox" data-opt="ignoreCase"> 忽略大小写</label>
            <label class="checkbox"><input type="checkbox" data-opt="keepOrder" checked> 保持原始顺序</label>
            <label class="checkbox"><input type="checkbox" data-opt="dropEmpty" checked> 删除空行</label>
            <label class="checkbox"><input type="checkbox" data-opt="sort"> 结果排序 (a→z)</label>
            <label class="checkbox"><input type="checkbox" data-opt="onlyDup"> 只输出有重复的行</label>
          </div>
          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" data-run>执行去重</button>
            <button class="btn" data-copy>复制结果</button>
            <button class="btn is-ghost" data-clear>清空</button>
          </div>
        </div>
      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
