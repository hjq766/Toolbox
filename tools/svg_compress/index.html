<body data-page="tool" data-base-path="../../" data-tool-slug="svg_compress">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览网格 -->
          <div>
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击、拖拽 SVG 文件或文件夹到此处</div>
              <div class="u-muted u-text-xs">支持多选批量压缩 · 支持拖拽到网页任意位置上传</div>
              <input type="file" accept=".svg,image/svg+xml" multiple hidden data-file>
              <input type="file" accept=".svg,image/svg+xml" multiple webkitdirectory hidden data-file-dir>
              <div class="u-row u-gap-2 u-mt-2">
                <button class="btn is-sm is-ghost" type="button" data-pick-dir title="选择文件夹，自动递归导入所有 SVG"><i data-lucide="folder-plus"></i> 选择文件夹</button>
                <button class="btn is-sm is-ghost" type="button" data-no-pick data-action="toggle-paste" title="粘贴单个 SVG 代码进行压缩"><i data-lucide="clipboard"></i> 粘贴代码</button>
              </div>
            </label>

            <!-- 粘贴区域（默认折叠） -->
            <div class="panel u-mt-3" data-paste-panel hidden>
              <h3 class="panel-title">粘贴 SVG 代码</h3>
              <textarea class="textarea u-mono u-text-xs" data-paste rows="6" placeholder="&lt;svg ...&gt;...&lt;/svg&gt;"></textarea>
              <div class="u-row u-gap-2 u-mt-2">
                <input class="input u-grow" data-paste-name placeholder="文件名（可选）" value="pasted.svg">
                <button class="btn is-sm is-primary" type="button" data-action="add-paste">加入列表</button>
              </div>
            </div>

            <!-- 进度 -->
            <div data-progress hidden class="u-mt-3">
              <div class="progress">
                <div class="progress-bar" data-bar></div>
              </div>
              <div class="u-muted u-text-xs u-mt-1" data-progress-text></div>
            </div>

            <!-- 预览网格 -->
            <div class="preview-grid" data-grid></div>
          </div>

          <!-- 右：设置面板 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">压缩档位</h3>
              <div class="opt-row" data-preset-row>
                <button class="btn is-sm" type="button" data-preset="safe" title="仅移除注释与空白，绝对不影响渲染">安全</button>
                <button class="btn is-sm is-active" type="button" data-preset="balanced" title="安全 + 移除 metadata、默认值、空 g，数值四舍五入到 3 位小数">平衡 ★</button>
                <button class="btn is-sm" type="button" data-preset="aggressive" title="在平衡基础上进一步压缩路径 d 数据精度到2位小数，体积更小但可能丢失细微精度">激进</button>
                <button class="btn is-sm" type="button" data-preset="custom" title="展开所有高级选项手动调整">自定义</button>
              </div>
              <p class="hint u-mt-2" data-preset-desc>移除 metadata、默认值、空 g，数值四舍五入到3位小数。<strong>推荐默认使用。</strong></p>
            </div>

            <div class="panel" data-custom-panel hidden>
              <h3 class="panel-title">自定义选项</h3>
              <div class="switch-list">
                <label class="switch-item"><input type="checkbox" data-opt="removeComments" checked> 移除注释</label>
                <label class="switch-item"><input type="checkbox" data-opt="removeMetadata" checked> 移除 metadata</label>
                <label class="switch-item"><input type="checkbox" data-opt="removeEmptyAttrs" checked> 移除空属性</label>
                <label class="switch-item"><input type="checkbox" data-opt="removeDefaults" checked> 移除默认值（黑色填充等）</label>
                <label class="switch-item"><input type="checkbox" data-opt="removeEmptyGroups" checked> 移除空 &lt;g&gt;</label>
                <label class="switch-item"><input type="checkbox" data-opt="roundNumbers" checked> 数值四舍五入</label>
                <label class="switch-item"><input type="checkbox" data-opt="roundPathData"> 路径 d 数据精度压缩</label>
                <label class="switch-item"><input type="checkbox" data-opt="minifyWhitespace" checked> 压缩空白</label>
              </div>
              <div class="field u-mt-3">
                <label class="label" for="svgNumericPrecision">普通数值精度</label>
                <select class="select" id="svgNumericPrecision" data-opt-numeric-precision>
                  <option value="4">保留 4 位小数</option>
                  <option value="3" selected>保留 3 位小数</option>
                  <option value="2">保留 2 位小数</option>
                  <option value="1">保留 1 位小数</option>
                  <option value="0">取整</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="svgPathPrecision">路径数据精度</label>
                <select class="select" id="svgPathPrecision" data-opt-path-precision>
                  <option value="4">保留 4 位小数</option>
                  <option value="3">保留 3 位小数</option>
                  <option value="2" selected>保留 2 位小数</option>
                  <option value="1">保留 1 位小数</option>
                  <option value="0">取整</option>
                </select>
              </div>
            </div>

            <!-- 汇总统计 -->
            <div class="panel" data-summary hidden>
              <h3 class="panel-title">压缩结果</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <div class="val" data-summary-count>0</div>
                  <div class="label">文件数</div>
                </div>
                <div class="summary-item">
                  <div class="val highlight" data-summary-saved>0%</div>
                  <div class="label">平均节省</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-before>0</div>
                  <div class="label">原始总大小</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-after>0</div>
                  <div class="label">压缩后总大小</div>
                </div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group u-col u-gap-2">
                <button class="btn is-primary is-block" type="button" data-action="compress" disabled>开始压缩</button>
                <div class="u-row u-gap-2">
                  <button class="btn is-block" type="button" data-action="download" hidden>批量下载</button>
                  <button class="btn is-ghost is-block" type="button" data-action="clear" hidden>清空列表</button>
                </div>
              </div>
            </div>

            <div class="panel">
              <p class="hint">需要精细编辑单个文件？<a href="../svg_code_editor/" class="u-link">打开 SVG 代码编辑器</a></p>
            </div>
          </aside>
        </div>

      </div>
    </div>
