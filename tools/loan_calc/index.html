<body data-page="tool" data-base-path="../../" data-tool-slug="loan_calc">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">

          <!-- 主区：方式 + 结果 -->
          <div class="u-col u-gap-4">

            <div class="tabs" data-methods>
              <button class="tab-btn is-active" type="button" data-method="equal-payment">等额还款</button>
              <button class="tab-btn" type="button" data-method="equal-principal">等额本金</button>
              <button class="tab-btn" type="button" data-method="compare">两种对比</button>
            </div>

            <!-- 单一方式结果 -->
            <div class="panel" data-panel="single">
              <div class="u-row u-between u-mb-3">
                <div>
                  <h3 class="panel-title u-mb-0" data-result-title>等额还款</h3>
                  <p class="hint u-mt-2" data-result-desc>每月还款金额固定，便于长期预算。</p>
                </div>
                <button class="btn is-sm is-ghost" type="button" data-action="copy-summary">复制结果</button>
              </div>
              <div class="stat-grid">
                <div class="stat">
                  <div class="stat-label" data-label="primary">月供</div>
                  <div class="stat-value" data-val="primary" style="color:var(--color-brand)">—</div>
                  <div class="stat-label u-mt-2" data-note="primary">元 / 月</div>
                </div>
                <div class="stat">
                  <div class="stat-label">支付利息</div>
                  <div class="stat-value" data-val="interest" style="color:var(--color-warning)">—</div>
                  <div class="stat-label u-mt-2">元</div>
                </div>
                <div class="stat">
                  <div class="stat-label">还款总额</div>
                  <div class="stat-value" data-val="total">—</div>
                  <div class="stat-label u-mt-2">元</div>
                </div>
              </div>
            </div>

            <!-- 对比结果 -->
            <div class="panel" data-panel="compare" hidden>
              <h3 class="panel-title">两种方式对比</h3>
              <div class="grid grid-2 u-mt-3">
                <div>
                  <h4 class="u-mt-0 u-mb-2">等额还款</h4>
                  <div class="result-row"><span>月供</span><strong data-val="cmp-ep-monthly" style="color:var(--color-brand)">—</strong></div>
                  <div class="result-row"><span>支付利息</span><strong data-val="cmp-ep-interest" style="color:var(--color-warning)">—</strong></div>
                  <div class="result-row"><span>还款总额</span><strong data-val="cmp-ep-total">—</strong></div>
                </div>
                <div>
                  <h4 class="u-mt-0 u-mb-2">等额本金</h4>
                  <div class="result-row"><span>首月月供</span><strong data-val="cmp-epr-first" style="color:var(--color-brand)">—</strong></div>
                  <div class="result-row"><span>支付利息</span><strong data-val="cmp-epr-interest" style="color:var(--color-warning)">—</strong></div>
                  <div class="result-row"><span>还款总额</span><strong data-val="cmp-epr-total">—</strong></div>
                </div>
              </div>
              <div class="result-strip u-mt-3" data-val="compare-summary" style="color:var(--color-success)">—</div>
            </div>

            <!-- 还款明细 -->
            <div class="panel" data-schedule-panel>
              <div class="u-row u-between">
                <div>
                  <h3 class="panel-title u-mb-0">还款明细</h3>
                  <p class="hint u-mt-2">按当前还款方式生成逐月明细。</p>
                </div>
                <button class="btn is-sm is-ghost" type="button" data-action="toggle-schedule">展开</button>
              </div>
              <div class="table-scroll u-mt-3" data-schedule hidden>
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>期次</th>
                      <th data-col-payment>月供</th>
                      <th>还本金</th>
                      <th>还利息</th>
                      <th>剩余本金</th>
                    </tr>
                  </thead>
                  <tbody data-schedule-body></tbody>
                </table>
              </div>
            </div>

          </div>

          <!-- 侧栏：贷款参数 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">贷款参数</h3>

              <div class="field u-mb-4">
                <label class="field-label">贷款金额</label>
                <div class="input-group">
                  <input class="input" type="number" data-input="amount" value="100" min="1" step="1">
                  <span class="addon u-nowrap">万元</span>
                </div>
              </div>

              <div class="field u-mb-2">
                <label class="field-label">贷款年限</label>
                <div class="input-group">
                  <input class="input" type="number" data-input="years" value="30" min="1" max="50" step="1">
                  <span class="addon u-nowrap">年</span>
                </div>
              </div>
              <div class="btn-group u-mb-4">
                <button class="btn is-sm is-ghost" type="button" data-preset-year="10">10 年</button>
                <button class="btn is-sm is-ghost" type="button" data-preset-year="20">20 年</button>
                <button class="btn is-sm is-ghost" type="button" data-preset-year="30">30 年</button>
              </div>

              <div class="field u-mb-2">
                <label class="field-label">年利率</label>
                <div class="input-group">
                  <input class="input" type="number" data-input="rate" value="3.7" min="0" max="30" step="0.01">
                  <span class="addon u-nowrap">%</span>
                </div>
              </div>
              <div class="btn-group">
                <button class="btn is-sm is-ghost" type="button" data-preset-rate="3.1">3.1%</button>
                <button class="btn is-sm is-ghost" type="button" data-preset-rate="3.7">3.7%</button>
                <button class="btn is-sm is-ghost" type="button" data-preset-rate="4.2">4.2%</button>
              </div>
            </div>
          </aside>

        </div>

      </div>
    </div>
