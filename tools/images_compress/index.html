<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片压缩 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <link rel="stylesheet" href="../_shared/preview-grid.css">
  <script src="../../public/vendor/browser-image-compression.js" defer></script>
  <script src="../../public/vendor/jszip.min.js" defer></script>
  <style>
    .status-badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 8px;font-size:var(--text-xs);border-radius:var(--radius-sm);font-weight:var(--font-semibold,600)}
    .status-badge.is-pending{background:var(--bg-surface-2);color:var(--fg-muted)}
    .status-badge.is-processing{background:var(--color-brand-alpha,rgba(59,130,246,.12));color:var(--color-brand)}
    .status-badge.is-done{background:rgba(34,197,94,.1);color:var(--color-success)}
    .status-badge.is-fail{background:rgba(239,68,68,.1);color:var(--color-danger,#ef4444)}
    .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
    .summary-item{text-align:center;padding:var(--space-3);background:var(--bg-surface-2);border-radius:var(--radius-md)}
    .summary-item .val{font-size:var(--text-lg);font-weight:var(--font-semibold,600);color:var(--fg-default)}
    .summary-item .val.highlight{color:var(--color-success)}
    .summary-item .label{font-size:var(--text-xs);color:var(--fg-muted);margin-top:2px}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_compress">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览网格 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF，可多选 · 支持粘贴上传</div>
              <input type="file" accept="image/*" multiple hidden data-file>
            </label>

            <!-- 进度 -->
            <div data-progress hidden class="u-mt-3">
              <div style="height:6px;background:var(--bg-surface-2);border-radius:var(--radius-sm);overflow:hidden">
                <div data-bar style="height:100%;background:var(--color-brand);width:0%;transition:width .15s"></div>
              </div>
              <div class="u-muted u-mt-1" style="font-size:var(--text-xs)" data-progress-text></div>
            </div>

            <!-- 预览网格 -->
            <div class="preview-grid" data-grid></div>
          </div>

          <!-- 右：设置面板 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">压缩模式</h3>
              <div class="u-col" style="gap:var(--space-2)">
                <label class="opt-card">
                  <input type="radio" name="mode" value="quality" data-mode>
                  <div><div class="u-strong">高质量</div><div class="hint" style="margin:0">保留 90% 质量</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="balanced" data-mode checked>
                  <div><div class="u-strong">均衡</div><div class="hint" style="margin:0">保留 80% 质量，推荐</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="aggressive" data-mode>
                  <div><div class="u-strong">极限压缩</div><div class="hint" style="margin:0">保留 50% 质量</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="custom" data-mode>
                  <div class="u-strong">自定义</div>
                </label>
              </div>

              <!-- 自定义质量 -->
              <div data-custom-quality hidden class="u-mt-3">
                <label class="field-label">质量</label>
                <div class="range-row">
                  <input type="range" data-quality min="10" max="100" value="80">
                  <span class="val" data-quality-val>80%</span>
                </div>
              </div>
            </div>

            <!-- 汇总统计 -->
            <div class="panel" data-summary hidden>
              <h3 class="panel-title">压缩结果</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <div class="val" data-summary-count>0</div>
                  <div class="label">文件数</div>
                </div>
                <div class="summary-item">
                  <div class="val highlight" data-summary-saved>0%</div>
                  <div class="label">平均节省</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-before>0</div>
                  <div class="label">原始总大小</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-after>0</div>
                  <div class="label">压缩后总大小</div>
                </div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="compress" disabled><i data-lucide="minimize-2"></i> 开始压缩</button>
                <button class="btn" data-action="download" hidden><i data-lucide="download"></i> 保存图片</button>
                <button class="btn is-ghost" data-action="clear" hidden><i data-lucide="trash-2"></i> 清空全部</button>
              </div>
            </div>

            <div class="panel">
              <p class="hint">上传图片后选择压缩模式，点击开始压缩。单张不超过 20MB。</p>
            </div>
          </aside>
        </div>

        <!-- 图片预览模态框 -->
        <div class="img-modal" data-modal>
          <img src="" alt="预览图片" data-modal-img>
          <button class="close-btn" data-modal-close><i data-lucide="x"></i></button>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
