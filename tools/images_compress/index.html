<body data-page="tool" data-base-path="../../" data-tool-slug="images_compress">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览网格 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击或拖拽图片、文件夹到此处</div>
              <div class="u-muted u-text-xs">支持 JPG / PNG / WebP / GIF，可多选 · 支持粘贴上传</div>
              <input type="file" accept="image/*" multiple hidden data-file>
              <input type="file" accept="image/*" multiple webkitdirectory hidden data-file-dir>
              <button class="btn is-sm is-ghost u-mt-2" type="button" data-pick-dir title="选择文件夹，自动递归导入所有图片"><i data-lucide="folder-plus"></i> 选择文件夹</button>
            </label>

            <!-- 进度 -->
            <div data-progress hidden class="u-mt-3">
              <div class="progress">
                <div class="progress-bar" data-bar></div>
              </div>
              <div class="u-muted u-text-xs u-mt-1" data-progress-text></div>
            </div>

            <!-- 预览网格 -->
            <div class="preview-grid" data-grid></div>
          </div>

          <!-- 右：设置面板 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">压缩模式</h3>
              <div class="u-col u-gap-2">
                <label class="opt-card">
                  <input type="radio" name="mode" value="quality" data-mode>
                  <div><div class="u-strong">高质量</div><div class="hint" style="margin:0">保留 90% 质量</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="balanced" data-mode checked>
                  <div><div class="u-strong">均衡</div><div class="hint" style="margin:0">保留 80% 质量，推荐</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="aggressive" data-mode>
                  <div><div class="u-strong">极限压缩</div><div class="hint" style="margin:0">保留 50% 质量</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="custom" data-mode>
                  <div class="u-strong">自定义</div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="target" data-mode>
                  <div><div class="u-strong">指定大小</div><div class="hint" style="margin:0">压缩到指定文件大小</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="mode" value="tinypng" data-mode>
                  <div><div class="u-strong">TinyPNG 云端</div><div class="hint" style="margin:0">高压缩率，需 API Key</div></div>
                </label>
              </div>

              <!-- 自定义质量 -->
              <div data-custom-quality hidden class="u-mt-3">
                <label class="field-label">质量</label>
                <div class="range-row">
                  <input type="range" data-quality min="10" max="100" value="80">
                  <span class="val" data-quality-val>80%</span>
                </div>
              </div>

              <!-- 指定大小 -->
              <div data-target-size hidden class="u-mt-3">
                <label class="field-label">目标大小（每张图片）</label>
                <div class="u-row u-gap-2 u-mt-1">
                  <div class="input-group" style="flex:1">
                    <input class="input" type="number" data-target-val min="1" value="200" placeholder="200">
                  </div>
                  <div class="field" style="width:70px">
                    <select class="select" data-target-unit>
                      <option value="kb">KB</option>
                      <option value="mb">MB</option>
                    </select>
                  </div>
                </div>
                <label class="opt-card u-mt-2">
                  <input type="checkbox" data-allow-resize>
                  <div><div class="u-strong">允许降低分辨率</div><div class="hint" style="margin:0">无法达到目标时缩小图片尺寸</div></div>
                </label>
              </div>

              <!-- TinyPNG 云端 -->
              <div data-tinypng-panel hidden class="u-mt-3">
                <label class="field-label">API Key</label>
                <div class="u-row u-gap-2 u-mt-1" style="align-items:center">
                  <input class="input" type="password" data-tinypng-key placeholder="粘贴你的 API Key" style="flex:1">
                  <button class="btn is-sm is-ghost" type="button" data-tinypng-show title="显示/隐藏 Key"><i data-lucide="eye"></i></button>
                </div>
                <div class="hint u-mt-1" data-tinypng-count></div>
                <div class="hint u-mt-1"><a href="https://tinify.com/developers" target="_blank" rel="noopener">获取免费 Key</a> · 每月 500 次 · 单张限 12MB</div>
              </div>
            </div>

            <!-- 汇总统计 -->
            <div class="panel" data-summary hidden>
              <h3 class="panel-title">压缩结果</h3>
              <div class="summary-grid">
                <div class="summary-item">
                  <div class="val" data-summary-count>0</div>
                  <div class="label">文件数</div>
                </div>
                <div class="summary-item">
                  <div class="val highlight" data-summary-saved>0%</div>
                  <div class="label">平均节省</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-before>0</div>
                  <div class="label">原始总大小</div>
                </div>
                <div class="summary-item">
                  <div class="val" data-summary-after>0</div>
                  <div class="label">压缩后总大小</div>
                </div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <div class="u-col u-gap-2">
                  <button class="btn is-primary is-block" data-action="compress" disabled>开始压缩</button>
                  <div class="u-row u-gap-2">
                    <button class="btn is-block" data-action="download" hidden>保存图片</button>
                    <button class="btn is-ghost is-block" data-action="clear" hidden>清空全部</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="panel">
              <p class="hint">上传图片后选择压缩模式，点击开始压缩。单张不超过 20MB。</p>
            </div>
          </aside>
        </div>

        <!-- 图片预览模态框 -->
        <div class="img-modal" data-modal>
          <img src="" alt="预览图片" data-modal-img>
          <button class="close-btn" data-modal-close><i data-lucide="x"></i></button>
        </div>

      </div>
    </div>
