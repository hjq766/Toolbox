<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面积换算 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="convert_area">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <div class="u-col u-gap-4">
            <div class="panel">
              <h3 class="panel-title">公制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">平方千米 (km²)</label><div class="input-group"><span class="addon">km²</span><input class="input u-mono" type="text" data-unit="sqkm" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">公顷 (ha)</label><div class="input-group"><span class="addon">ha</span><input class="input u-mono" type="text" data-unit="ha" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方米 (m²)</label><div class="input-group"><span class="addon">m²</span><input class="input u-mono" type="text" data-unit="sqm" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方分米 (dm²)</label><div class="input-group"><span class="addon">dm²</span><input class="input u-mono" type="text" data-unit="sqdm" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方厘米 (cm²)</label><div class="input-group"><span class="addon">cm²</span><input class="input u-mono" type="text" data-unit="sqcm" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方毫米 (mm²)</label><div class="input-group"><span class="addon">mm²</span><input class="input u-mono" type="text" data-unit="sqmm" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">英制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">平方英里 (mi²)</label><div class="input-group"><span class="addon">mi²</span><input class="input u-mono" type="text" data-unit="sqmi" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">英亩 (ac)</label><div class="input-group"><span class="addon">ac</span><input class="input u-mono" type="text" data-unit="acre" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方杆 (rd²)</label><div class="input-group"><span class="addon">rd²</span><input class="input u-mono" type="text" data-unit="sqrd" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方英尺 (ft²)</label><div class="input-group"><span class="addon">ft²</span><input class="input u-mono" type="text" data-unit="sqft" autocomplete="off"></div></div>
                <div class="field"><label class="field-label">平方英寸 (in²)</label><div class="input-group"><span class="addon">in²</span><input class="input u-mono" type="text" data-unit="sqin" autocomplete="off"></div></div>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">中国市制</h3>
              <div class="grid grid-2 u-gap-3">
                <div class="field"><label class="field-label">亩</label><div class="input-group"><span class="addon">亩</span><input class="input u-mono" type="text" data-unit="mu" autocomplete="off"></div></div>
              </div>
            </div>
          </div>

          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <label class="field-label">选择单位</label>
              <select class="select u-mb-3" data-quick-unit>
                <option value="sqm">平方米 (m²)</option>
                <option value="sqkm">平方千米 (km²)</option>
                <option value="ha">公顷 (ha)</option>
                <option value="mu">亩</option>
                <option value="acre">英亩 (ac)</option>
                <option value="sqft">平方英尺 (ft²)</option>
              </select>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="10">10</button>
                <button class="btn is-sm" data-quick="100">100</button>
                <button class="btn is-sm" data-quick="1000">1000</button>
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row"><input type="range" min="2" max="10" value="6" data-precision><span class="val" data-precision-val>6 位</span></div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn" type="button" data-action="copy-all"><i data-lucide="copy"></i> 复制全部</button>
                <button class="btn is-ghost" type="button" data-action="reset">重置</button>
              </div>
            </div>
            <div class="panel"><p class="hint">在任意输入框输入数值，其它单位自动换算。</p></div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
