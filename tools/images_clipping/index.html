<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片裁剪 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .preview-wrap{position:relative;background:var(--bg-surface-2);border-radius:var(--radius);overflow:hidden;min-height:300px;display:flex;align-items:center;justify-content:center}
    .preview-wrap canvas{max-width:100%;max-height:500px;display:block}
    .crop-box{position:absolute;border:2px solid var(--color-brand,#3b82f6);cursor:move;display:none}
    .crop-box.active{display:block}
    .crop-box::after{content:'';position:absolute;inset:0;background:transparent}
    .crop-handle{position:absolute;width:10px;height:10px;background:var(--color-brand,#3b82f6);border:1px solid #fff;border-radius:2px}
    .crop-handle.nw{top:-5px;left:-5px;cursor:nw-resize}
    .crop-handle.ne{top:-5px;right:-5px;cursor:ne-resize}
    .crop-handle.sw{bottom:-5px;left:-5px;cursor:sw-resize}
    .crop-handle.se{bottom:-5px;right:-5px;cursor:se-resize}
    .crop-handle.n{top:-5px;left:50%;margin-left:-5px;cursor:n-resize}
    .crop-handle.s{bottom:-5px;left:50%;margin-left:-5px;cursor:s-resize}
    .crop-handle.w{top:50%;left:-5px;margin-top:-5px;cursor:w-resize}
    .crop-handle.e{top:50%;right:-5px;margin-top:-5px;cursor:e-resize}
    .result-wrap{text-align:center}
    .result-wrap img{max-width:100%;max-height:400px;border-radius:var(--radius)}
    .info-sm{font-size:var(--text-xs);color:var(--text-muted)}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_clipping">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览 -->
            <div class="panel u-mt-3" data-preview hidden>
              <div class="u-row u-gap-2 u-mb-2" style="justify-content:space-between;align-items:center">
                <div class="u-row u-gap-1">
                  <button class="btn is-sm" data-action="rotate-left" title="左旋90°">↺</button>
                  <button class="btn is-sm" data-action="rotate-right" title="右旋90°">↻</button>
                  <button class="btn is-sm" data-action="flip-h" title="水平翻转">⇔</button>
                  <button class="btn is-sm" data-action="flip-v" title="垂直翻转">⇕</button>
                  <button class="btn is-sm" data-action="reset">重置</button>
                </div>
                <div class="u-row u-gap-1">
                  <span class="info-sm" data-size-info></span>
                  <button class="btn is-sm is-ghost" data-action="delete">✕</button>
                </div>
              </div>
              <div class="preview-wrap" data-image-preview>
                <canvas data-canvas></canvas>
                <div class="crop-box" data-crop-box>
                  <div class="crop-handle nw"></div><div class="crop-handle n"></div><div class="crop-handle ne"></div>
                  <div class="crop-handle w"></div><div class="crop-handle e"></div>
                  <div class="crop-handle sw"></div><div class="crop-handle s"></div><div class="crop-handle se"></div>
                </div>
              </div>
              <div class="u-mt-1 info-sm" data-crop-size></div>
            </div>

            <!-- 结果 -->
            <div class="panel u-mt-3 result-wrap" data-result hidden>
              <img data-result-img>
              <div class="u-mt-2 u-row u-gap-2" style="justify-content:center">
                <button class="btn is-primary" data-action="download">下载</button>
                <button class="btn" data-action="continue">继续裁剪</button>
              </div>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">裁剪比例</h3>
              <div class="opt-row" data-ratio-opts>
                <button class="btn is-sm active" data-ratio="free">自由</button>
                <button class="btn is-sm" data-ratio="1:1">1:1</button>
                <button class="btn is-sm" data-ratio="4:3">4:3</button>
                <button class="btn is-sm" data-ratio="16:9">16:9</button>
                <button class="btn is-sm" data-ratio="3:2">3:2</button>
                <button class="btn is-sm" data-ratio="2:3">2:3</button>
              </div>
              <div class="hint">拖动裁剪框调整区域，快捷选择常用比例</div>
            </div>
            <div class="panel">
              <h3 class="panel-title">输出格式</h3>
              <div class="opt-row" data-format-opts>
                <button class="btn is-sm active" data-fmt="image/jpeg">JPG</button>
                <button class="btn is-sm" data-fmt="image/png">PNG</button>
                <button class="btn is-sm" data-fmt="image/webp">WebP</button>
              </div>
            </div>
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="crop" disabled>裁剪</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
