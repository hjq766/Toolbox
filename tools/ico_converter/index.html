  <style>
    /* 图层网格 */
    .layer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-3)}
    .layer-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-3);border:1px solid var(--border-base);border-radius:var(--radius-md);background:var(--bg-surface);text-align:center;cursor:pointer;transition:all .15s;position:relative}
    .layer-card:hover{border-color:var(--color-brand)}
    .layer-card.selected{border-color:var(--color-brand);background:color-mix(in srgb,var(--color-brand) 6%,transparent)}
    .layer-card .check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;border:2px solid var(--border-base);background:var(--bg-surface);transition:all .12s;display:flex;align-items:center;justify-content:center}
    .layer-card.selected .check{border-color:var(--color-brand);background:var(--color-brand)}
    .layer-card.selected .check::after{content:'';display:block;width:6px;height:6px;border-radius:50%;background:#fff}
    .lc-preview{display:flex;align-items:center;justify-content:center;min-height:64px}
    .lc-preview canvas{image-rendering:pixelated;border-radius:var(--radius-sm);box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .lc-info{font-size:var(--text-xs)}
    .lc-size{font-weight:700;font-variant-numeric:tabular-nums}
    .lc-meta{color:var(--fg-muted);font-size:10px;margin-top:1px}

    /* 棋盘格背景 */
    .checker{background-image:linear-gradient(45deg,var(--bg-surface-2) 25%,transparent 25%),linear-gradient(-45deg,var(--bg-surface-2) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--bg-surface-2) 75%),linear-gradient(-45deg,transparent 75%,var(--bg-surface-2) 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}

    /* 放大模态框 */
    [data-layer-modal]{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .modal-box{background:var(--bg-surface);border-radius:var(--radius-md);padding:var(--space-6);text-align:center;position:relative;cursor:default;max-width:90vw}

<body data-page="tool" data-base-path="../../" data-tool-slug="ico_converter">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:280px">
          <!-- 左：上传 + 图层列表 -->
          <div>
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击或拖拽图标文件到此处</div>
              <div class="u-muted u-text-xs">支持 ICO / ICNS 格式 · 支持粘贴上传</div>
              <input type="file" accept=".ico,.icns,image/x-icon,image/vnd.microsoft.icon" hidden data-file>
            </label>

            <!-- 文件信息 + 图层 -->
            <div class="panel u-mt-3" data-layers-panel hidden>

              <!-- Level 1：文件标识 -->
              <div class="u-row u-gap-2 u-mb-3" style="align-items:center">
                <span style="font-weight:600;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0" data-file-name></span>
                <span class="hint" style="flex-shrink:0" data-file-size></span>
                <button class="btn is-sm is-ghost" type="button" style="flex-shrink:0" data-img-delete><i data-lucide="x"></i></button>
              </div>

              <!-- Level 2：图层区标题 -->
              <div class="u-row u-between u-mb-2" style="align-items:center;padding-top:var(--space-2);border-top:1px solid var(--border-subtle)">
                <span style="font-size:var(--text-xs);font-weight:600;color:var(--fg-muted);letter-spacing:.04em">图层列表</span>
                <div class="u-row u-gap-2">
                  <button class="btn is-sm is-ghost" data-action="select-all">全选</button>
                  <button class="btn is-sm is-ghost" data-action="select-none">取消全选</button>
                </div>
              </div>

              <!-- Level 3：图层网格 -->
              <div class="layer-grid" data-layer-grid></div>

            </div>

            <!-- 进度 -->
            <div data-progress hidden class="u-mt-3">
              <div class="progress">
                <div class="progress-bar" data-bar></div>
              </div>
              <div class="u-muted u-text-xs u-mt-1" data-prog-text></div>
            </div>
          </div>

          <!-- 右：设置 -->
          <aside>
            <!-- 输出格式 -->
            <div class="panel">
              <h3 class="panel-title">输出格式</h3>
              <div class="opt-row" data-fmt-opts>
                <button class="btn is-sm active" data-fmt="png">PNG</button>
                <button class="btn is-sm" data-fmt="jpg">JPG</button>
                <button class="btn is-sm" data-fmt="webp">WebP</button>
              </div>
            </div>

            <!-- 质量（JPG/WebP） -->
            <div class="panel" data-quality-panel hidden>
              <h3 class="panel-title">
                <span>图片质量</span>
                <span class="val" data-quality-val>92%</span>
              </h3>
              <div class="range-row">
                <input type="range" data-quality min="10" max="100" value="92">
              </div>
              <div class="hint u-row u-between"><span>压缩</span><span>高质量</span></div>
            </div>

            <!-- 缩放 -->
            <div class="panel">
              <h3 class="panel-title">缩放倍率</h3>
              <div class="opt-row" data-scale-row>
                <button class="btn is-sm active" data-scale="1">1×</button>
                <button class="btn is-sm" data-scale="2">2×</button>
                <button class="btn is-sm" data-scale="4">4×</button>
              </div>
              <p class="hint u-mt-1">放大低分辨率图层便于查看</p>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <h3 class="panel-title">操作</h3>
              <div class="act-group">
                <div class="u-col u-gap-2">
                  <button class="btn is-primary is-block" data-action="export" disabled>导出选中图层</button>
                  <button class="btn is-block" data-action="download-zip" disabled>下载 ZIP</button>
                </div>
              </div>
            </div>
          </aside>
        </div>

      </div>
