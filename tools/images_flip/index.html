<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片翻转 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <style>
    .preview-wrap{position:relative;background:var(--bg-surface-2);border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:300px}
    .preview-wrap canvas{max-width:100%;max-height:500px;display:block}
    .img-info{display:grid;grid-template-columns:auto 1fr;gap:2px var(--space-3);font-size:var(--text-xs);color:var(--fg-muted);margin-top:var(--space-3)}
    .img-info dt{font-weight:600;color:var(--fg-default)}
    .state-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:var(--text-xs);border-radius:var(--radius-sm);background:var(--bg-surface-2);color:var(--fg-muted)}
    .state-tag.is-active{background:var(--color-brand-alpha,rgba(59,130,246,.12));color:var(--color-brand)}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_flip">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览 -->
            <div class="panel u-mt-3" data-preview hidden>
              <div class="preview-wrap">
                <canvas data-canvas></canvas>
              </div>
              <dl class="img-info" data-info>
                <dt>文件名</dt><dd data-info-name>-</dd>
                <dt>尺寸</dt><dd data-info-dim>-</dd>
                <dt>大小</dt><dd data-info-size>-</dd>
                <dt>格式</dt><dd data-info-type>-</dd>
              </dl>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <!-- 翻转 -->
            <div class="panel">
              <h3 class="panel-title">翻转</h3>
              <div class="opt-row">
                <button class="btn is-sm" data-action="flip-h"><i data-lucide="flip-horizontal"></i> 水平</button>
                <button class="btn is-sm" data-action="flip-v"><i data-lucide="flip-vertical"></i> 垂直</button>
              </div>
            </div>
            <!-- 旋转 -->
            <div class="panel">
              <h3 class="panel-title">旋转</h3>
              <div class="opt-row">
                <button class="btn is-sm" data-action="rotate-ccw"><i data-lucide="rotate-ccw"></i> 左 90°</button>
                <button class="btn is-sm" data-action="rotate-cw"><i data-lucide="rotate-cw"></i> 右 90°</button>
              </div>
              <div class="opt-row u-mt-2">
                <button class="btn is-sm" data-action="rotate-180">旋转 180°</button>
              </div>
            </div>
            <!-- 当前状态 -->
            <div class="panel" data-state-panel hidden>
              <h3 class="panel-title">当前变换</h3>
              <div class="u-row u-gap-2" style="flex-wrap:wrap" data-state-tags></div>
            </div>
            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="download" disabled><i data-lucide="download"></i> 下载</button>
                <button class="btn is-ghost" data-action="reset">重置变换</button>
                <button class="btn is-ghost" data-action="delete" hidden>删除图片</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
