<body data-page="tool" data-base-path="../../" data-tool-slug="barcode">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：输入 + 预览 -->
          <div class="u-col u-gap-3">
            <div class="panel">
              <h3 class="panel-title">内容</h3>
              <div class="field">
                <input class="input u-mono" type="text" data-content
                  placeholder="输入文字或数字…" value="1234567890">
              </div>
              <p class="hint" data-format-hint>CODE128：支持 ASCII 全字符集</p>
            </div>

            <div class="panel">
              <div style="min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-4)">
                <div data-barcode-wrap style="background:#fff;padding:16px;border-radius:var(--radius-md);display:inline-block">
                  <svg data-barcode></svg>
                </div>
                <p data-barcode-error class="hint" style="color:var(--color-danger);margin-top:var(--space-2)" hidden></p>
              </div>
              <div class="u-row u-gap-2 u-mt-3" style="justify-content:center">
                <button class="btn is-primary" type="button" data-action="download-png">PNG</button>
                <button class="btn" type="button" data-action="download-svg">SVG</button>
              </div>
            </div>
          </div>

          <!-- 右：参数面板 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">格式</h3>
              <div class="field">
                <select class="select" data-param="format">
                  <option value="CODE128">CODE128（通用）</option>
                  <option value="CODE39">CODE39</option>
                  <option value="EAN13">EAN-13</option>
                  <option value="EAN8">EAN-8</option>
                  <option value="UPC">UPC-A</option>
                  <option value="ITF14">ITF-14</option>
                  <option value="MSI">MSI</option>
                  <option value="pharmacode">Pharmacode</option>
                </select>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">外观</h3>
              <div class="field">
                <label class="field-label">线条宽度</label>
                <div class="range-row">
                  <input type="range" min="1" max="4" value="2" step="0.5" data-param="lineWidth">
                  <span class="val" data-range-val="lineWidth">2</span>
                </div>
              </div>
              <div class="field">
                <label class="field-label">高度 (px)</label>
                <div class="range-row">
                  <input type="range" min="40" max="200" value="100" step="10" data-param="height">
                  <span class="val" data-range-val="height">100</span>
                </div>
              </div>
              <div class="grid grid-2 u-gap-2">
                <div class="field">
                  <label class="field-label">前景色</label>
                  <input class="input" type="color" data-param="lineColor" value="#000000">
                </div>
                <div class="field">
                  <label class="field-label">背景色</label>
                  <input class="input" type="color" data-param="background" value="#ffffff">
                </div>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">文字</h3>
              <div class="field">
                <label class="switch-item">
                  <input type="checkbox" data-param="displayValue" checked> 显示内容文字
                </label>
              </div>
              <div class="field" data-text-opts>
                <label class="field-label">字体大小 (px)</label>
                <div class="range-row">
                  <input type="range" min="8" max="24" value="14" step="1" data-param="fontSize">
                  <span class="val" data-range-val="fontSize">14</span>
                </div>
              </div>
              <div class="field" data-text-opts>
                <label class="field-label">文字位置</label>
                <select class="select" data-param="textPosition">
                  <option value="bottom">底部</option>
                  <option value="top">顶部</option>
                </select>
              </div>
            </div>
          </aside>
        </div>

        <p class="field-hint u-muted" style="margin:0;text-align:center">
          条形码生成由开源项目
          <a href="https://github.com/lindell/JsBarcode" target="_blank" rel="noopener noreferrer">JsBarcode</a>
          （MIT）提供。
        </p>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
