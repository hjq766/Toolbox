<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML/JS 转换 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="html_javascript">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <!-- 选项 -->
          <div class="u-row u-gap-4 u-mb-4" style="flex-wrap:wrap;align-items:center">
            <label class="checkbox"><input type="checkbox" data-opt="createElement"> 使用 createElement</label>
            <label class="checkbox"><input type="checkbox" data-opt="minify"> 压缩输出</label>
          </div>

          <!-- 双栏编辑器 -->
          <div class="grid grid-2">
            <div class="field cm-embed" style="grid-template-rows:auto 1fr">
              <label class="field-label">HTML 代码</label>
              <textarea class="textarea u-mono" data-input placeholder="<div>Hello <b>World</b></div>" style="min-height:300px"></textarea>
            </div>
            <div class="field cm-embed" style="grid-template-rows:auto 1fr">
              <label class="field-label">JavaScript 代码</label>
              <textarea class="textarea u-mono" data-output readonly style="min-height:300px"></textarea>
            </div>
          </div>

          <!-- 操作 -->
          <div class="u-row u-gap-3 u-mt-4" style="flex-wrap:wrap;justify-content:space-between;align-items:center">
            <button class="btn is-primary" type="button" data-action="convert">转换</button>
            <div class="btn-group">
              <button class="btn" type="button" data-action="copy">复制</button>
              <button class="btn" type="button" data-action="download">导出</button>
              <button class="btn is-ghost" type="button" data-action="clear">清空</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
