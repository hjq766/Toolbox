<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片格式转换 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
  <link rel="stylesheet" href="../_shared/preview-grid.css">
  <script src="../../public/vendor/jszip.min.js" defer></script>
  <style>
    .preview-info .info-row .cv{color:var(--color-brand)}
    .fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
    .fmt-grid .btn{padding:8px 4px;font-size:var(--text-xs);font-weight:var(--font-semibold,600)}
    .fmt-grid .btn.active{background:var(--color-brand);color:#fff;border-color:var(--color-brand)}
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="images_convert">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览网格 -->
          <div>
            <label class="panel u-col u-gap-2" data-drop style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="font-size:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG / PNG / WebP / GIF / BMP / TIFF，可多选 · 支持粘贴上传</div>
              <input type="file" accept="image/*" multiple hidden data-file>
            </label>

            <div data-progress hidden class="u-mt-3">
              <div style="height:6px;background:var(--bg-surface-2);border-radius:3px;overflow:hidden">
                <div data-bar style="height:100%;background:var(--color-brand);width:0%;transition:width .15s"></div>
              </div>
              <div class="u-muted u-mt-1" style="font-size:var(--text-xs)" data-progress-text></div>
            </div>

            <div class="preview-grid" data-grid></div>
          </div>

          <!-- 右：设置面板 -->
          <aside>
            <!-- 输出格式 -->
            <div class="panel">
              <h3 class="panel-title">输出格式</h3>
              <div class="fmt-grid" data-fmt-grid>
                <button class="btn active" data-fmt="jpg">JPG</button>
                <button class="btn" data-fmt="png">PNG</button>
                <button class="btn" data-fmt="webp">WebP</button>
                <button class="btn" data-fmt="gif">GIF</button>
                <button class="btn" data-fmt="bmp">BMP</button>
                <button class="btn" data-fmt="tiff">TIFF</button>
              </div>
            </div>

            <!-- 质量 -->
            <div class="panel" data-quality-panel hidden>
              <h3 class="panel-title">
                <span>图片质量</span>
                <span class="val" data-quality-val>95%</span>
              </h3>
              <div class="range-row">
                <input type="range" data-quality min="10" max="100" value="95">
              </div>
              <div class="hint u-row u-between"><span>压缩</span><span>高质量</span></div>
            </div>

            <!-- WebP 透明度 -->
            <div class="panel" data-alpha-panel hidden>
              <h3 class="panel-title">透明度处理</h3>
              <div class="u-col" style="gap:var(--space-2)">
                <label class="opt-card">
                  <input type="radio" name="alpha" value="preserve" data-alpha checked>
                  <div><div class="u-strong">保留透明度</div><div class="hint" style="margin:0">保持 PNG 的透明通道</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="alpha" value="remove" data-alpha>
                  <div><div class="u-strong">移除透明度</div><div class="hint" style="margin:0">使用白色背景填充</div></div>
                </label>
              </div>
            </div>

            <!-- 尺寸 -->
            <div class="panel">
              <h3 class="panel-title">调整尺寸</h3>
              <div class="opt-row" style="flex-wrap:wrap" data-size-row>
                <button class="btn active" data-size="original">原始尺寸</button>
                <button class="btn" data-size="0.5x">缩小 0.5x</button>
                <button class="btn" data-size="2x">放大 2x</button>
                <button class="btn" data-size="hd">HD</button>
                <button class="btn" data-size="fhd">Full HD</button>
                <button class="btn" data-size="4k">4K</button>
                <button class="btn" data-size="square">正方形</button>
                <button class="btn" data-size="custom">自定义</button>
              </div>
              <div data-custom-size hidden class="u-mt-3">
                <div class="u-row u-gap-2" style="align-items:center">
                  <input class="input" data-cw type="number" placeholder="宽度" min="1" style="width:80px">
                  <i data-lucide="link" style="cursor:pointer;color:var(--color-brand)" data-link-icon></i>
                  <input class="input" data-ch type="number" placeholder="高度" min="1" style="width:80px">
                </div>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="convert" disabled>开始转换</button>
                <button class="btn is-ghost" data-action="clear" hidden>清空所有</button>
              </div>
            </div>

            <!-- 命名 + 下载 -->
            <div class="panel" data-download-panel hidden>
              <h3 class="panel-title">文件命名方式</h3>
              <div class="u-col" style="gap:var(--space-2)">
                <label class="opt-card">
                  <input type="radio" name="naming" value="original" data-naming checked>
                  <div><div class="u-strong">保留原名</div><div class="hint" style="margin:0">使用原始文件名</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="naming" value="converted" data-naming>
                  <div><div class="u-strong">转换命名</div><div class="hint" style="margin:0">converted_文件名</div></div>
                </label>
              </div>
              <div class="act-group u-mt-3">
                <button class="btn is-primary" data-action="download">
                  <i data-lucide="download"></i> 保存图片
                </button>
              </div>
            </div>
          </aside>
        </div>

        <!-- 图片预览模态框 -->
        <div class="img-modal" data-modal>
          <img src="" alt="预览图片" data-modal-img>
          <button class="close-btn" data-modal-close><i data-lucide="x"></i></button>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
