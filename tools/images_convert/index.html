    .fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
    .fmt-grid .btn{padding:8px 4px;font-size:var(--text-xs);font-weight:var(--font-semibold,600)}

<body data-page="tool" data-base-path="../../" data-tool-slug="images_convert">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：上传 + 预览网格 -->
          <div>
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击或拖拽图片、文件夹到此处</div>
              <div class="u-muted u-text-xs">支持 JPG / PNG / WebP / GIF / BMP / TIFF / HEIC，可多选 · 支持粘贴上传</div>
              <input type="file" accept="image/*,.heic,.heif" multiple hidden data-file>
              <input type="file" accept="image/*,.heic,.heif" multiple webkitdirectory hidden data-file-dir>
              <button class="btn is-sm is-ghost u-mt-2" type="button" data-pick-dir title="选择文件夹，自动递归导入所有图片"><i data-lucide="folder-plus"></i> 选择文件夹</button>
            </label>

            <div data-progress hidden class="u-mt-3">
              <div class="progress">
                <div class="progress-bar" data-bar></div>
              </div>
              <div class="u-muted u-text-xs u-mt-1" data-progress-text></div>
            </div>

            <div class="preview-grid" data-grid></div>
          </div>

          <!-- 右：设置面板 -->
          <aside>
            <!-- 输出格式 -->
            <div class="panel">
              <h3 class="panel-title">输出格式</h3>
              <div class="fmt-grid" data-fmt-grid>
                <button class="btn is-active" data-fmt="jpg">JPG</button>
                <button class="btn" data-fmt="png">PNG</button>
                <button class="btn" data-fmt="webp">WebP</button>
                <button class="btn" data-fmt="gif">GIF</button>
                <button class="btn" data-fmt="bmp" title="部分浏览器不支持，导出结果可能为 PNG">BMP *</button>
                <button class="btn" data-fmt="tiff" title="部分浏览器不支持，导出结果可能为 PNG">TIFF *</button>
              </div>
              <p class="hint u-mt-2">* 部分浏览器不支持，建议改用 PNG</p>
            </div>

            <!-- 质量 -->
            <div class="panel" data-quality-panel hidden>
              <h3 class="panel-title">
                <span>图片质量</span>
                <span class="val" data-quality-val>95%</span>
              </h3>
              <div class="range-row">
                <input type="range" data-quality min="10" max="100" value="95">
              </div>
              <div class="hint u-row u-between"><span>压缩</span><span>高质量</span></div>
            </div>

            <!-- WebP 透明度 -->
            <div class="panel" data-alpha-panel hidden>
              <h3 class="panel-title">透明度处理</h3>
              <div class="u-col u-gap-2">
                <label class="opt-card">
                  <input type="radio" name="alpha" value="preserve" data-alpha checked>
                  <div><div class="u-strong">保留透明度</div><div class="hint" style="margin:0">保持 PNG 的透明通道</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="alpha" value="remove" data-alpha>
                  <div><div class="u-strong">移除透明度</div><div class="hint" style="margin:0">使用白色背景填充</div></div>
                </label>
              </div>
            </div>

            <!-- 尺寸 -->
            <div class="panel">
              <h3 class="panel-title">调整尺寸</h3>
              <div class="opt-row" style="flex-wrap:wrap" data-size-row>
                <button class="btn is-active" data-size="original">原始尺寸</button>
                <button class="btn" data-size="0.5x">0.5x</button>
                <button class="btn" data-size="0.75x">0.75x</button>
                <button class="btn" data-size="2x">2x</button>
                <button class="btn" data-size="square">正方形</button>
                <button class="btn" data-size="maxside">限制长边</button>
                <button class="btn" data-size="custom">自定义</button>
              </div>
              <div data-maxside-size hidden class="u-mt-3">
                <div class="input-group">
                  <input class="input" data-ms type="number" placeholder="如 1920" min="1">
                  <span class="addon">px</span>
                </div>
                <div class="hint u-mt-1">按每张图自身比例缩放，横竖均适用</div>
              </div>
              <div data-custom-size hidden class="u-mt-3">
                <div class="u-row u-gap-2" style="align-items:center">
                  <div class="input-group" style="flex:1">
                    <input class="input" data-cw type="number" placeholder="宽" min="1">
                    <span class="addon">px</span>
                  </div>
                  <i data-lucide="link" style="cursor:pointer;color:var(--color-brand)" data-link-icon></i>
                  <div class="input-group" style="flex:1">
                    <input class="input" data-ch type="number" placeholder="高" min="1">
                    <span class="addon">px</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 文件命名方式 -->
            <div class="panel">
              <h3 class="panel-title">文件命名方式</h3>
              <div class="u-col u-gap-2">
                <label class="opt-card">
                  <input type="radio" name="naming" value="original" data-naming checked>
                  <div><div class="u-strong">保留原名</div><div class="hint" style="margin:0">使用原始文件名</div></div>
                </label>
                <label class="opt-card">
                  <input type="radio" name="naming" value="converted" data-naming>
                  <div><div class="u-strong">转换命名</div><div class="hint" style="margin:0">converted_文件名</div></div>
                </label>
              </div>
            </div>

            <!-- 操作 -->
            <div class="panel">
              <div class="act-group">
                <div class="u-col u-gap-2">
                  <button class="btn is-primary is-block" data-action="convert" disabled>开始转换</button>
                  <button class="btn is-block" data-action="download" hidden>保存图片</button>
                  <button class="btn is-ghost is-block" data-action="clear" hidden>清空所有</button>
                </div>
              </div>
            </div>
          </aside>
        </div>

        <!-- 图片预览模态框 -->
        <div class="img-modal" data-modal>
          <img src="" alt="预览图片" data-modal-img>
          <button class="close-btn" data-modal-close><i data-lucide="x"></i></button>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
