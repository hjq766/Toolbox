  <style>
    /* ---- 月历网格 ---- */
    .cal { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; font-size: var(--text-sm); }
    .cal b { font-weight: 600; padding: 6px 0; color: var(--fg-muted); }
    .cal i { font-style: normal; padding: 6px 2px; border-radius: var(--radius-sm); cursor: pointer; line-height: 1.3; }
    .cal i:hover { background: var(--bg-surface-2); }
    .cal i.today { background: var(--color-brand); color: #fff; border-radius: var(--radius-md); }
    .cal i.sel { outline: 2px solid var(--color-brand); outline-offset: -2px; border-radius: var(--radius-md); }
    .cal i small { display: block; font-size: 10px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal i .f { color: var(--color-danger); }
    .cal i .fm { color: var(--fg-muted); }
    .cal i.today small { color: rgba(255,255,255,.8); }
    .cal i.today .f { color: #fca5a5; }
    .cal i .ft { color: var(--color-success); }
    .cal i.today .ft { color: rgba(255,255,255,.8); }
    /* ---- 自定义选择器 ---- */
    .pk { position: relative; flex: 1; }
    .pk-trigger {
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      width: 100%; padding: 8px 12px; font-size: var(--text-sm); font-weight: 500;
      background: var(--bg-surface); border: 1px solid var(--border-base);
      border-radius: var(--radius-md); cursor: pointer; color: var(--fg-strong);
      transition: border-color .15s;
    }
    .pk-trigger:hover, .pk-trigger.open { border-color: var(--color-brand); }
    .pk-trigger::after { content: '▾'; font-size: 10px; color: var(--fg-muted); }
    .pk-drop {
      position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
      z-index: 20; background: var(--bg-surface); border: 1px solid var(--border-base);
      border-radius: var(--radius-md); padding: var(--space-2);
      box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 240px; overflow-y: auto;
      min-width: max-content; display: none;
    }
    .pk-drop.show { display: block; }
    .pk-grid { display: grid; gap: 2px; }
    .pk-grid.cols-4 { grid-template-columns: repeat(4,1fr); }
    .pk-grid.cols-5 { grid-template-columns: repeat(5,1fr); }
    .pk-grid.cols-7 { grid-template-columns: repeat(7,1fr); }
    .pk-grid span {
      display: flex; align-items: center; justify-content: center;
      padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: var(--text-sm); white-space: nowrap; transition: background .1s;
    }
    .pk-grid span:hover { background: var(--bg-surface-2); }
    .pk-grid span.on { background: var(--color-brand); color: #fff; }
    .pk-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .pk-nav button { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); color: var(--fg-strong); font-size: var(--text-sm); }
    .pk-nav button:hover { background: var(--bg-surface-2); }
    .pk-nav strong { font-size: var(--text-sm); }
  </style>
