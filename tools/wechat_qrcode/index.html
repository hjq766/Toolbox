<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号二维码提取 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="wechat_qrcode">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：预览 -->
          <div>
            <div class="panel" style="text-align:center;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div data-placeholder>
                <div class="u-muted" style="font-size:48px">📱</div>
                <div class="u-muted u-mt-2">输入公众号 ID 后生成二维码</div>
              </div>
              <div data-loading hidden>
                <div class="u-muted">加载中…</div>
              </div>
              <div data-error hidden>
                <div style="color:var(--color-danger)" data-error-msg></div>
              </div>
              <div data-result hidden>
                <img data-qr-img style="max-width:280px;border-radius:var(--radius)">
              </div>
            </div>
          </div>

          <!-- 右：输入 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">公众号 ID</h3>
              <div class="field">
                <input class="input" type="text" data-wechat-id placeholder="例如：jqnest" autofocus>
              </div>
              <div class="u-col u-gap-2 u-mt-4">
                <button class="btn is-primary" type="button" data-action="generate">生成二维码</button>
                <button class="btn is-ghost" type="button" data-action="clear">清空</button>
              </div>
            </div>

            <div class="panel" data-export hidden>
              <h3 class="panel-title">导出</h3>
              <div class="u-col u-gap-2">
                <button class="btn" type="button" data-action="download">下载二维码</button>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
