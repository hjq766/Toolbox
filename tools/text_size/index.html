<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本分析器 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="text_size">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">
        <div class="panel">
          <label class="field-label">输入文本</label>
          <textarea class="textarea" data-text placeholder="粘贴或输入任意文本…" style="min-height:220px;font-family:var(--font-sans)"></textarea>
          <div class="u-row u-gap-3 u-mt-3">
            <button class="btn is-ghost" data-clear>清空</button>
            <span class="u-muted" data-tip></span>
          </div>
        </div>
        <div class="panel">
          <div class="stat-grid" data-stats></div>
        </div>
      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
