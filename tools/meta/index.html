          <!-- 左：实时代码输出 -->
          <div class="cm-embed cm-fill" style="min-height:520px">
            <textarea class="textarea u-mono" data-result readonly placeholder="填写右侧字段，代码实时生成…" style="font-size:var(--text-sm);flex:1;resize:none"></textarea>

              <div class="u-col u-gap-3">
                <div class="field">
                  <label class="field-label" for="m-title">Title 网页标题</label>
                  <input class="input" id="m-title" data-field="title" placeholder="10–30 个字符最佳" autocomplete="off">

                <div class="field">
                  <label class="field-label" for="m-desc">Description 描述</label>

                  <label class="field-label" for="m-keywords">Keywords 关键词</label>

                <div class="field">
                  <label class="field-label" for="m-author">Author 作者</label>

                  <input class="input" id="m-copyright" data-field="copyright" placeholder="可留空" autocomplete="off">

                <div class="field">
                  <label class="field-label" for="m-language">Language 语言</label>

                <div class="field">

                    <option value="noindex,nofollow">noindex,nofollow</option>
                    <option value="index">index</option>
                    <option value="noindex">noindex</option>
                    <option value="follow">follow</option>
                    <option value="nofollow">nofollow</option>
                  </select>
                </div>
                <div class="field">
                  <label class="field-label" for="m-viewport">Viewport</label>
                  <select class="select" id="m-viewport" data-field="viewport">
                    <option value="responsive">PC + 移动自适应</option>

                    <option value="none">不输出</option>
