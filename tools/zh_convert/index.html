<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简繁体转换 · jqnest 工具箱</title>
  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js" defer></script>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="zh_convert">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-2">
          <!-- 输入 -->
          <div class="panel">
            <div class="u-row u-between u-mb-4" style="align-items:center;min-height:32px">
              <label class="field-label" for="zhIn" style="margin:0">输入文本</label>
              <span class="field-hint" data-count>0 字</span>
            </div>
            <div class="field">
              <textarea class="textarea" id="zhIn" data-input placeholder="在此输入中文文本..." style="min-height:220px"></textarea>
            </div>
            <div class="u-mt-4">
              <button class="btn is-ghost is-sm" type="button" data-action="clear"><i data-lucide="trash-2"></i> 清空</button>
            </div>
          </div>

          <!-- 输出 -->
          <div class="panel">
            <div class="grid-chips u-mb-4">
              <div class="chip is-active" data-mode="zh_cn">大陆简体</div>
              <div class="chip" data-mode="zh_hant">繁体中文</div>
              <div class="chip" data-mode="zh_hk">港澳繁體</div>
              <div class="chip" data-mode="zh_tw">台灣正體</div>
            </div>
            <div class="field">
              <textarea class="textarea" id="zhOut" data-output readonly placeholder="转换结果" style="min-height:220px"></textarea>
            </div>
            <div class="u-mt-4">
              <button class="btn is-primary is-sm" type="button" data-action="copy"><i data-lucide="copy"></i> 复制结果</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
