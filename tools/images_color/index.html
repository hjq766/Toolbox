<body data-page="tool" data-base-path="../../" data-tool-slug="images_color">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左 -->
          <div>
            <!-- 上传 -->
            <label class="panel u-col u-gap-2 upload-panel" data-drop>
              <i data-lucide="upload"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted u-text-xs">支持 JPG / PNG / WebP / GIF · 支持粘贴上传</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览 -->
            <div class="panel u-mt-3" data-preview-section hidden>
              <div class="u-row u-between u-mb-2">
                <div class="u-row u-gap-1">
                  <button class="btn is-sm" data-mode="manual" title="手动取色"><i data-lucide="pipette"></i> 取色</button>
                  <button class="btn is-sm" data-mode="selection" title="选区提取"><i data-lucide="scan-line"></i> 选区</button>
                  <span class="preview-hint" data-preview-status>自动提取</span>
                </div>
                <div class="u-row u-gap-1">
                  <button class="btn is-sm is-ghost" data-zoom="out" title="缩小"><i data-lucide="zoom-out"></i></button>
                  <span class="zoom-label" data-zoom-label>100%</span>
                  <button class="btn is-sm is-ghost" data-zoom="in" title="放大"><i data-lucide="zoom-in"></i></button>
                  <button class="btn is-sm is-ghost" data-zoom="fit" title="适应窗口">适应</button>
                  <button class="btn is-sm is-ghost" type="button" data-img-delete><i data-lucide="x"></i></button>
                </div>
              </div>
              <div class="preview-wrap" data-preview-wrap>
                <div class="preview-inner">
                  <canvas data-canvas></canvas>
                  <div class="color-loupe" data-loupe hidden>
                    <canvas width="72" height="72" data-loupe-canvas></canvas>
                    <strong data-loupe-color>—</strong>
                    <span data-loupe-point>—</span>
                  </div>
                  <span class="selection-badge" data-selection-badge hidden>0 × 0</span>
                </div>
              </div>
            </div>

            <!-- 色板 -->
            <div class="panel u-mt-3" data-colors-section hidden>
              <div class="u-row u-between u-mb-2">
                <h3 class="panel-title u-mb-0">提取色板</h3>
                <div class="u-row u-gap-1">
                  <button class="btn is-sm is-ghost" data-action="export-img">导出图片</button>
                  <button class="btn is-sm is-ghost" data-action="export-css">导出 CSS</button>
                  <button class="btn is-sm is-ghost" data-action="export-tailwind">导出 Tailwind</button>
                  <button class="btn is-sm is-ghost" data-action="export-json">导出 JSON</button>
                  <button class="btn is-sm is-ghost" data-action="clear-colors">清空</button>
                </div>
              </div>
              <div class="palette-strip u-mb-3" data-palette-strip></div>
              <div class="grid grid-auto-sm" data-color-list></div>
              <div class="card u-mt-3" data-color-detail hidden>
                <div class="color-detail-banner" data-detail-swatch>
                  <span class="color-detail-banner-hex" data-detail-hex-display>—</span>
                  <span class="color-detail-banner-source" data-detail-source>—</span>
                </div>
                <div class="card-body u-col u-gap-3">
                  <div class="u-col u-gap-2">
                    <div class="field u-mb-0">
                      <label class="field-label">HEX</label>
                      <div class="input-group">
                        <input class="input u-mono" readonly data-detail-hex>
                        <button class="btn is-sm" type="button" data-copy-format="hex">复制</button>
                      </div>
                    </div>
                    <div class="field u-mb-0">
                      <label class="field-label">RGB</label>
                      <div class="input-group">
                        <input class="input u-mono" readonly data-detail-rgb>
                        <button class="btn is-sm" type="button" data-copy-format="rgb">复制</button>
                      </div>
                    </div>
                    <div class="field u-mb-0">
                      <label class="field-label">HSL</label>
                      <div class="input-group">
                        <input class="input u-mono" readonly data-detail-hsl>
                        <button class="btn is-sm" type="button" data-copy-format="hsl">复制</button>
                      </div>
                    </div>
                  </div>
                  <a class="btn is-sm is-block" target="_blank" data-detail-open-tool href="#">在颜色工具箱中继续调色</a>
                  <div class="output-grid u-mb-0">
                    <div><strong data-detail-hue>0°</strong><span>色相</span></div>
                    <div><strong data-detail-saturation>0%</strong><span>饱和度</span></div>
                    <div><strong data-detail-lightness>0%</strong><span>亮度</span></div>
                    <div><strong data-detail-text>—</strong><span>推荐文字</span></div>
                    <div><strong data-detail-white-ratio>0:1</strong><span>白字对比</span></div>
                    <div><strong data-detail-black-ratio>0:1</strong><span>黑字对比</span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 右 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">取色数量</h3>
              <div class="opt-row" data-count-opts>
                <button class="btn is-sm" data-count="3">3</button>
                <button class="btn is-sm active" data-count="5">5</button>
                <button class="btn is-sm" data-count="8">8</button>
                <button class="btn is-sm" data-count="12">12</button>
                <button class="btn is-sm" data-count="16">16</button>
                <button class="btn is-sm" data-count="20">20</button>
              </div>
            </div>
            <div class="panel" data-selection-panel hidden>
              <h3 class="panel-title">选区结果</h3>
              <div class="opt-row" data-selection-mode-opts>
                <button class="btn is-sm active" data-selection-mode="append">追加</button>
                <button class="btn is-sm" data-selection-mode="replace">替换</button>
              </div>
            </div>
            <div class="panel" data-bulk-actions hidden>
              <h3 class="panel-title">色板整理</h3>
              <div class="field">
                <div class="field-label">近似色合并</div>
                <div class="field-hint">数值越宽松，越容易把相近颜色合成一个。</div>
                <div class="opt-row" data-merge-opts>
                  <button class="btn is-sm" data-merge-threshold="8">严格</button>
                  <button class="btn is-sm active" data-merge-threshold="14">均衡</button>
                  <button class="btn is-sm" data-merge-threshold="22">宽松</button>
                </div>
                <button class="btn is-block u-mt-3 is-primary" type="button" data-action="merge-similar">合并近似色</button>
              </div>
              <div class="field u-mt-3">

                  <button class="btn is-sm is-ghost" type="button" data-action="copy-css">复制 CSS 变量</button>
                  <button class="btn is-sm is-ghost" type="button" data-action="copy-tailwind">复制 Tailwind</button>

            </div>

              <div class="opt-row" data-sort-opts>

                <button class="btn is-sm" data-sort="brightness">亮度</button>
                <button class="btn is-sm" data-sort="hue">色相</button>
                <button class="btn is-sm" data-sort="saturation">饱和度</button>
              </div>
            </div>

              <h3 class="panel-title">颜色格式</h3>
              <div class="opt-row" data-format-opts>
                <button class="btn is-sm active" data-format="hex">HEX</button>

                <button class="btn is-sm" data-format="hsl">HSL</button>

            </div>
