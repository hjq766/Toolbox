<body data-page="tool" data-base-path="../../" data-tool-slug="chart_combo">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="chart-studio">
          <div class="chart-stage">
            <div class="chart-canvas" id="chart"></div>
          </div>

          <div class="chart-controls">
            <div class="panel">

              <div class="cs-section is-open" data-section="data">
                <button class="cs-header" type="button">数据编辑</button>
                <div class="cs-body">
                  <div data-editor></div>
                </div>
              </div>

              <div class="cs-section is-open" data-section="series">
                <button class="cs-header" type="button">系列设置</button>
                <div class="cs-body">
                  <div class="u-col u-gap-2" data-series-list></div>
                  <p class="hint u-mb-0">柱状系列默认映射左轴，折线系列默认映射右轴</p>
                </div>
              </div>

              <div class="cs-section" data-section="palette">
                <button class="cs-header" type="button">配色方案</button>
                <div class="cs-body">
                  <div class="palette-grid u-mb-2" data-palette></div>
                  <div class="custom-colors-area" data-custom-colors hidden>
                    <div class="opt-row u-mb-2" data-color-mode>
                      <button class="btn is-sm active" data-val="pick">逐个配色</button>
                      <button class="btn is-sm" data-val="gradient">渐变生成</button>
                    </div>
                    <div data-mode-pick>
                      <div class="color-pickers-row" data-color-pickers></div>
                    </div>
                    <div data-mode-gradient hidden>
                      <div class="gradient-row">
                        <input type="color" value="#165DFF" data-grad-start>
                        <div class="gradient-preview" data-grad-preview></div>
                        <input type="color" value="#00B42A" data-grad-end>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="cs-section" data-section="options">
                <button class="cs-header" type="button">图表选项</button>
                <div class="cs-body">
                  <div class="u-col u-gap-3">
                    <div class="u-row u-gap-2">
                      <div class="field" style="flex:1">
                        <label class="field-label">导出宽度</label>
                        <input class="input is-sm" type="number" data-opt="width" value="800" min="400" max="2000" step="10">
                      </div>
                      <div class="field" style="flex:1">
                        <label class="field-label">导出高度</label>
                        <input class="input is-sm" type="number" data-opt="height" value="480" min="200" max="1200" step="10">
                      </div>
                    </div>
                    <div class="co-sep"></div>
                    <label class="co-toggle">
                      <input type="checkbox" data-opt="dual-axis" checked>
                      <span class="co-toggle-track"></span>
                      双 Y 轴
                    </label>
                    <div data-axis-names>
                      <div class="field u-mb-2">
                        <label class="field-label">左轴名称</label>
                        <input class="input is-sm" type="text" data-opt="axis-left" value="销售额（万元）" placeholder="左轴标题">
                      </div>
                      <div class="field">
                        <label class="field-label">右轴名称</label>
                        <input class="input is-sm" type="text" data-opt="axis-right" value="同比增长（%）" placeholder="右轴标题">
                      </div>
                    </div>
                    <div class="co-sep"></div>
                    <div class="co-row">
                      <span class="co-label">折线</span>
                      <div class="co-seg" data-smooth>
                        <button class="active" data-val="off">折线</button>
                        <button data-val="on">平滑</button>
                      </div>
                    </div>
                    <div class="co-sep"></div>
                    <div class="co-row">
                      <label class="co-toggle">
                        <input type="checkbox" data-opt="legend" checked>
                        <span class="co-toggle-track"></span>
                        图例
                      </label>
                      <div class="co-seg" data-legend-pos>
                        <button data-val="left">左</button>
                        <button class="active" data-val="center">中</button>
                        <button data-val="right">右</button>
                        <button data-val="bottom">底部</button>
                      </div>
                    </div>
                    <label class="co-toggle">
                      <input type="checkbox" data-opt="label">
                      <span class="co-toggle-track"></span>
                      数据标签
                    </label>
                    <div class="co-sep"></div>
                    <div class="range-row">
                      <label class="field-label">柱圆角</label>
                      <input type="range" min="0" max="20" value="4" data-opt="radius">
                      <span class="val" data-val-radius>4</span>
                    </div>
                    <div class="range-row">
                      <label class="field-label">线宽</label>
                      <input type="range" min="1" max="6" value="2" data-opt="line-width">
                      <span class="val" data-val-line-width>2</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <div class="panel">
              <div class="act-group">
                <div class="u-col u-gap-2">
                  <button class="btn is-primary is-block" data-export="png">下载 PNG</button>
                  <button class="btn is-block" data-export="svg">下载 SVG</button>
                </div>
              </div>
            </div>

          </div>
        </div>

        <p class="field-hint u-muted" style="margin:0;text-align:center">

          <a href="https://github.com/apache/echarts" target="_blank" rel="noopener noreferrer">Apache ECharts</a>
          （Apache-2.0）提供。
        </p>

      </div>
