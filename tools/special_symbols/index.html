<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../../public/styles/tokens.css">

  <style>
    .sym-chip { position: relative; font-size: var(--text-lg); padding: 8px 10px; min-width: 38px; justify-content: center; }
    .sym-chip::after { content: '点击复制'; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding: 2px 8px; border-radius: var(--radius-sm); background: var(--fg-strong); color: var(--bg-page); font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .sym-chip:hover::after { opacity: 1; }
  </style>
</head>
<body data-page="tool" data-base-path="../../" data-tool-slug="special_symbols">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <label class="search-shell" style="max-width:460px">
            <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
            <input class="search-box" type="search" data-search placeholder="搜索符号…" autocomplete="off">
          </label>
          <div class="field-hint u-mt-2" data-status></div>
        </div>

        <div class="panel">
          <div class="tabs" role="tablist" data-tabs></div>
          <div data-content class="u-mt-4"></div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
