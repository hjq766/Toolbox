<body data-page="tool" data-base-path="../../" data-tool-slug="grid_layout">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="tabs u-mb-3" role="tablist">
          <button class="tab-btn is-active" data-tab="recommend" type="button">栅格系统</button>
          <button class="tab-btn" data-tab="manual" type="button">网格类型</button>
        </div>

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：主内容 -->
          <div>
            <div data-view="recommend">
              <div class="u-col u-gap-3" data-plan-list></div>
            </div>
            <div data-view="manual" hidden>
              <div class="gl-grid" data-grid-preview style="max-width:100%;margin:0 auto"></div>
              <div class="stat-grid u-mt-4" data-preview-info></div>
            </div>
          </div>

          <!-- 右：控制面板 -->
          <aside>
            <!-- ===== 栅格系统 ===== -->
            <div data-section="recommend">
              <div class="panel">
                <h3 class="panel-title">基础参数</h3>
                <div class="field">
                  <label class="field-label">容器宽度</label>
                  <div class="input-group">
                    <input class="input" type="number" data-input="containerWidth" value="1440" min="300" max="3000">
                    <span class="addon">px</span>
                  </div>
                </div>
                <label class="field-label u-mt-3">列数</label>
                <div class="opt-row">
                  <button class="btn" type="button" data-cols="4">4</button>
                  <button class="btn" type="button" data-cols="6">6</button>
                  <button class="btn" type="button" data-cols="8">8</button>
                  <button class="btn is-active" type="button" data-cols="12">12</button>
                  <button class="btn" type="button" data-cols="16">16</button>
                  <button class="btn" type="button" data-cols="24">24</button>
                </div>
                <div class="input-group u-mt-2">
                  <button class="addon" type="button" data-step="cols" data-dir="-1">−</button>
                  <input class="input is-center" type="number" data-input="desiredCols" value="12" min="1" max="36">
                  <button class="addon" type="button" data-step="cols" data-dir="1">+</button>
                </div>
              </div>

              <div class="panel">
                <h3 class="panel-title">边距偏好</h3>
                <div class="u-col" style="gap:6px">
                  <label class="opt-card">
                    <input type="radio" name="marginPref" value="0">
                    <div><div style="font-weight:600">无边距</div><div class="hint" style="margin:0">满屏布局，最大化内容展示</div></div>
                  </label>
                  <label class="opt-card">
                    <input type="radio" name="marginPref" value="auto" checked>
                    <div><div style="font-weight:600">有边距</div><div class="hint" style="margin:0">居中布局，自动推导边距</div></div>
                  </label>
                  <label class="opt-card">
                    <input type="radio" name="marginPref" value="custom">
                    <div><div style="font-weight:600">自定义</div><div class="hint" style="margin:0">精确控制间距与边距</div></div>
                  </label>
                </div>
              </div>

              <div class="panel" data-show="spacing">
                <h3 class="panel-title">间距风格</h3>
                <div class="tabs">
                  <button class="tab-btn" data-style="compact" type="button">紧凑</button>
                  <button class="tab-btn is-active" data-style="balanced" type="button">均衡</button>
                  <button class="tab-btn" data-style="spacious" type="button">宽松</button>
                </div>
              </div>

              <div class="panel" data-show="custom-params" hidden>
                <h3 class="panel-title">自定义参数</h3>
                <div class="field">
                  <label class="field-label">列间距</label>
                  <div class="input-group">
                    <input class="input" type="number" data-input="customGap" value="16" min="0" max="100">
                    <span class="addon">px</span>
                  </div>
                </div>
                <div class="field u-mt-3">
                  <label class="field-label">左右边距</label>
                  <div class="input-group">
                    <input class="input" type="number" data-input="customSideMargin" value="0" min="0" max="200">
                    <span class="addon">px</span>
                  </div>
                </div>
              </div>

            </div>

            <!-- ===== 网格类型 ===== -->
            <div data-section="manual" hidden>
              <div class="panel">
                <h3 class="panel-title">精细调整</h3>
                <div class="field">
                  <label class="field-label">行数</label>
                  <div class="input-group">
                    <button class="addon" type="button" data-step="rows" data-dir="-1">−</button>
                    <input class="input is-center" type="number" data-input="rowCount" min="1" max="36" value="1">
                    <button class="addon" type="button" data-step="rows" data-dir="1">+</button>
                  </div>
                </div>
                <div class="field u-mt-3">
                  <label class="field-label">左右边距</label>
                  <div class="input-group">
                    <button class="addon" type="button" data-step="margin" data-dir="-1">−</button>
                    <input class="input is-center" type="number" data-input="gridSideMargin" min="0" max="100" value="16">
                    <button class="addon" type="button" data-step="margin" data-dir="1">+</button>
                  </div>
                </div>
                <div class="field u-mt-3">
                  <label class="field-label">列间距</label>
                  <div class="input-group">
                    <button class="addon" type="button" data-step="colGap" data-dir="-1">−</button>
                    <input class="input is-center" type="number" data-input="colGap" min="0" max="50" value="20">
                    <button class="addon" type="button" data-step="colGap" data-dir="1">+</button>
                  </div>
                </div>
                <div class="field u-mt-3">
                  <label class="field-label">行间距</label>
                  <div class="input-group">
                    <button class="addon" type="button" data-step="rowGap" data-dir="-1">−</button>
                    <input class="input is-center" type="number" data-input="rowGap" min="0" max="50" value="20">
                    <button class="addon" type="button" data-step="rowGap" data-dir="1">+</button>
                  </div>
                </div>
              </div>

              <div class="panel">
                <div class="act-group">
                  <div class="u-row u-gap-2">
                    <button class="btn is-primary is-block" type="button" data-action="export">导出预览图</button>
                    <button class="btn is-block" type="button" data-action="copyCSS">复制 CSS</button>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>
