<body data-page="tool" data-base-path="../../" data-tool-slug="pdf_merge_split">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <!-- ── 模式切换 ── -->
        <div class="tabs u-mb-4" data-mode-tabs>
          <button class="tab-btn is-active" type="button" data-mode="merge">合并 PDF
          </button>
          <button class="tab-btn" type="button" data-mode="split">拆分 PDF
          </button>
        </div>

        <!-- ══════════════════════════════
             合并面板
        ══════════════════════════════ -->
        <div data-panel="merge">
          <div class="grid grid-sidebar-r" style="--sidebar-w:280px">

            <!-- 左：上传区 + 文件列表 -->
            <div class="u-col u-gap-3">

              <!-- 上传区（多文件） -->
              <label class="panel u-col u-gap-2 upload-panel" data-merge-drop>
                <i data-lucide="upload-cloud" class="icon-24"></i>
                <div class="u-strong">点击或拖拽 PDF 到此处（支持多文件）</div>
                <div class="u-muted u-text-xs">可多次添加，文件将按列表顺序合并</div>
                <input type="file" accept=".pdf,application/pdf" multiple hidden data-merge-file>
              </label>

              <!-- 文件列表 -->
              <div class="panel" data-merge-list hidden>
                <div class="u-row u-between u-mb-3">
                  <span class="panel-title u-mb-0" style="border:none;padding:0;margin:0">已添加文件</span>
                  <button class="btn is-ghost is-sm" type="button" data-action="merge-clear">清空</button>
                </div>
                <div class="u-col u-gap-2" data-merge-files></div>
              </div>

            </div>

            <!-- 右：合并设置 + 操作 -->
            <aside>
              <div class="panel">
                <h3 class="panel-title">合并设置</h3>
                <div class="field">
                  <label class="field-label">输出文件名</label>
                  <div class="input-group">
                    <input class="input" type="text" value="merged" data-out-name placeholder="merged">
                    <span class="addon">.pdf</span>
                  </div>
                </div>
                <div class="u-col u-gap-1 u-mt-3" data-merge-summary hidden>
                  <div class="result-row">
                    <span class="u-muted">文件数</span>
                    <span class="u-strong" data-stat-files>0</span>
                  </div>
                  <div class="result-row">
                    <span class="u-muted">总页数</span>
                    <span class="u-strong" data-stat-pages>0</span>
                  </div>
                </div>
                <div class="act-group u-mt-3">
                  <button class="btn is-primary is-block" type="button" data-action="merge-run" disabled>
                    合并下载
                  </button>
                </div>
                <div data-merge-progress hidden class="u-mt-3">
                  <div class="progress"><div class="progress-bar" data-merge-bar></div></div>
                  <div class="u-text-xs u-muted u-mt-1" data-merge-status></div>
                </div>
              </div>

              <div class="panel">
                <p class="hint">文件全部在本地处理，不会上传至服务器</p>
              </div>
            </aside>

          </div>
        </div>

        <!-- ══════════════════════════════
             拆分面板
        ══════════════════════════════ -->
        <div data-panel="split" hidden>
          <div class="grid grid-sidebar-r" style="--sidebar-w:280px">

            <!-- 左：上传区 + 文件信息 -->
            <div class="u-col u-gap-3">

              <!-- 上传区（单文件） -->
              <label class="panel u-col u-gap-2 upload-panel" data-split-drop>
                <i data-lucide="upload-cloud" class="icon-24"></i>
                <div class="u-strong">点击或拖拽 PDF 到此处</div>
                <div class="u-muted u-text-xs">仅支持单个 PDF 文件</div>
                <input type="file" accept=".pdf,application/pdf" hidden data-split-file>
              </label>

              <!-- 文件信息 -->
              <div class="panel" data-split-info hidden>
                <div class="u-row u-gap-3">
                  <i data-lucide="file-text" class="icon-24 u-muted u-no-shrink"></i>
                  <div class="u-grow u-min-0">
                    <div class="u-strong u-truncate" data-split-fname></div>
                    <div class="u-muted u-text-xs u-mt-2">
                      <span data-split-pages>0</span> 页 · <span data-split-size></span>
                    </div>
                  </div>
                  <button class="btn is-ghost is-sm u-no-shrink" type="button" data-action="split-clear">
                    <i data-lucide="x" class="icon-16"></i>
                  </button>
                </div>
              </div>

            </div>

            <!-- 右：拆分设置 + 操作 -->
            <aside>
              <div class="panel">
                <h3 class="panel-title">拆分设置</h3>

                <!-- 拆分方式 -->
                <div class="field">
                  <label class="field-label">拆分方式</label>
                  <div class="opt-row" style="margin-top:0" data-split-mode>
                    <button class="btn is-sm is-active" type="button" data-val="each">每页一份</button>
                    <button class="btn is-sm" type="button" data-val="range">自定义范围</button>
                  </div>
                </div>

                <!-- 自定义范围输入 -->
                <div data-range-panel hidden class="u-col u-gap-2">
                  <div class="field">
                    <label class="field-label">页面范围</label>
                    <input class="input" type="text" data-range-input
                      placeholder="如：1-3, 4-6, 7">
                    <div class="field-hint">逗号分隔，每段生成一个 PDF</div>
                  </div>
                  <div class="u-text-xs u-muted" data-range-hint></div>
                </div>

                <div class="act-group u-mt-3">
                  <button class="btn is-primary is-block" type="button" data-action="split-run" disabled>
                    拆分下载 ZIP
                  </button>
                </div>
                <div data-split-progress hidden class="u-mt-3">
                  <div class="progress"><div class="progress-bar" data-split-bar></div></div>
                  <div class="u-text-xs u-muted u-mt-1" data-split-status></div>
                </div>
              </div>

              <div class="panel">
                <p class="hint">文件全部在本地处理，不会上传至服务器</p>
              </div>
            </aside>

          </div>
        </div>

        <p class="field-hint u-muted" style="margin:0;text-align:center">
          PDF 处理由开源项目
          <a href="https://github.com/Hopding/pdf-lib" target="_blank" rel="noopener noreferrer">pdf-lib</a>
          与
          <a href="https://github.com/Stuk/jszip" target="_blank" rel="noopener noreferrer">JSZip</a>
          （MIT）提供。
        </p>

      </div>
    </div>
  </div></main></div>
