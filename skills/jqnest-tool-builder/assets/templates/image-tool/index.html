<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO: 修改标题 -->
  <title>图片处理 · 极趣导航-在线工具箱</title>

  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<!-- TODO: 修改 data-tool-slug -->
<body data-page="tool" data-base-path="../../" data-tool-slug="TODO_SLUG">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:300px">
          <!-- 左：主内容区 -->
          <div class="u-col u-gap-4">

            <!-- 上传区 -->
            <label class="panel u-col u-gap-2" data-drop
                   style="border-style:dashed;align-items:center;text-align:center;cursor:pointer;padding:var(--space-8) var(--space-4);margin:0">
              <i data-lucide="upload" style="width:1.8rem;height:1.8rem;opacity:.35"></i>
              <div class="u-strong">点击或拖拽图片到此处</div>
              <div class="u-muted" style="font-size:var(--text-xs)">支持 JPG/PNG/WebP · 最大 10MB · 支持粘贴</div>
              <input type="file" accept="image/*" hidden data-file>
            </label>

            <!-- 预览区（初始隐藏） -->
            <div class="panel" data-preview-panel hidden>
              <canvas data-canvas style="max-width:100%;border-radius:var(--radius-md)"></canvas>
            </div>

            <!-- 文件信息（初始隐藏） -->
            <div class="panel" data-info-panel hidden>
              <h3 class="panel-title">文件信息</h3>
              <div class="stat-grid">
                <div class="stat">
                  <div class="stat-label">文件名</div>
                  <div class="stat-value" data-info="name">—</div>
                </div>
                <div class="stat">
                  <div class="stat-label">尺寸</div>
                  <div class="stat-value" data-info="size">—</div>
                </div>
                <div class="stat">
                  <div class="stat-label">分辨率</div>
                  <div class="stat-value" data-info="dimensions">—</div>
                </div>
                <div class="stat">
                  <div class="stat-label">格式</div>
                  <div class="stat-value" data-info="type">—</div>
                </div>
              </div>
            </div>

          </div>

          <!-- 右：侧栏 -->
          <aside>
            <!-- TODO: 添加工具专属参数面板 -->
            <div class="panel">
              <h3 class="panel-title">参数</h3>
              <p class="u-muted" style="font-size:var(--text-sm)">TODO: 添加工具参数</p>
            </div>

            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="download" disabled>
                  <i data-lucide="download"></i> 下载
                </button>
                <button class="btn is-ghost" data-action="delete" disabled>
                  <i data-lucide="trash-2"></i> 删除图片
                </button>
              </div>
            </div>

            <div class="panel">
              <p class="hint">上传图片后即可操作。建议单张不超过 10MB。</p>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
