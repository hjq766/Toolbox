<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO: 修改标题 -->
  <title>代码工具 · 极趣导航-在线工具箱</title>

  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">

  <!-- TODO: 如需第三方格式化库（js-beautify / js-yaml…），在此 CDN 引入 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/js-beautify@1/js/lib/beautify.min.js" defer></script> -->
</head>
<!-- TODO: 修改 data-tool-slug -->
<body data-page="tool" data-base-path="../../" data-tool-slug="TODO_SLUG">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="panel">
          <div class="grid grid-2">
            <div class="field">
              <label class="field-label">输入</label>
              <!-- TODO: 调整 rows / placeholder -->
              <textarea class="textarea" data-input="src" rows="18"
                        placeholder="粘贴代码…"></textarea>
            </div>
            <div class="field">
              <label class="field-label">输出</label>
              <textarea class="textarea" data-output rows="18" readonly
                        placeholder="处理结果"></textarea>
            </div>
          </div>

          <div class="u-row u-gap-3 u-mt-4">
            <button class="btn is-primary" data-action="run">
              <i data-lucide="wand-sparkles"></i> 处理
            </button>
            <button class="btn" data-action="copy">
              <i data-lucide="copy"></i> 复制结果
            </button>
            <button class="btn is-ghost" data-action="clear">清空</button>
          </div>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
