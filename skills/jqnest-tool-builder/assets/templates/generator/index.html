<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO: 修改标题 -->
  <title>生成器 · 极趣导航-在线工具箱</title>

  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<!-- TODO: 修改 data-tool-slug -->
<body data-page="tool" data-base-path="../../" data-tool-slug="TODO_SLUG">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:280px">
          <!-- 左：实时预览区 -->
          <div class="u-col u-gap-4">

            <div class="panel" data-preview-panel
                 style="min-height:300px;display:flex;align-items:center;justify-content:center">
              <!-- TODO: 替换为实际预览 DOM（canvas / div / svg） -->
              <div data-preview style="font-size:var(--text-lg);color:var(--color-text-2)">
                预览区
              </div>
            </div>

            <!-- 结果输出（可选） -->
            <div class="panel" data-result-panel hidden>
              <div class="field">
                <label class="field-label">生成结果</label>
                <textarea class="textarea" data-output rows="6" readonly></textarea>
              </div>
              <div class="u-row u-gap-3 u-mt-3">
                <button class="btn" data-action="copy">
                  <i data-lucide="copy"></i> 复制
                </button>
                <button class="btn" data-action="download">
                  <i data-lucide="download"></i> 下载
                </button>
              </div>
            </div>

          </div>

          <!-- 右：参数面板 -->
          <aside>
            <!-- TODO: 根据业务添加参数控件 -->
            <div class="panel">
              <h3 class="panel-title">参数</h3>

              <div class="field">
                <label class="field-label">长度</label>
                <div class="range-row">
                  <input type="range" min="4" max="64" value="16" data-param="length">
                  <span class="val" data-val="length">16</span>
                </div>
              </div>

              <div class="field">
                <label class="field-label">选项</label>
                <div class="switch-list">
                  <label class="switch-item">
                    <input type="checkbox" data-param="opt-a" checked> 选项A
                  </label>
                  <label class="switch-item">
                    <input type="checkbox" data-param="opt-b"> 选项B
                  </label>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="generate">
                  <i data-lucide="refresh-cw"></i> 生成
                </button>
              </div>
            </div>

            <div class="panel">
              <p class="hint">调整参数后点击生成，或参数变化时自动刷新。</p>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
