<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO: 修改标题 -->
  <title>长度换算 · 极趣导航-在线工具箱</title>

  <link rel="stylesheet" href="../../public/styles/tokens.css">
  <link rel="stylesheet" href="../../public/styles/themes.css">
  <link rel="stylesheet" href="../../public/styles/base.css">
  <link rel="stylesheet" href="../../public/styles/layout.css">
  <link rel="stylesheet" href="../../public/styles/components.css">
  <link rel="stylesheet" href="../../public/styles/utilities.css">
  <link rel="stylesheet" href="../_shared/sidebar.css">
</head>
<!-- TODO: 修改 data-tool-slug -->
<body data-page="tool" data-base-path="../../" data-tool-slug="TODO_SLUG">
  <div class="page-shell"><main class="page-main"><div class="container">
    <div class="tool-layout">
      <header class="tool-header" data-tool-header></header>
      <div class="tool-body">

        <div class="grid grid-sidebar-r" style="--sidebar-w:260px">
          <!-- 左：换算输入区 -->
          <div class="u-col u-gap-4">

            <!-- TODO: 按体系分组（公制 / 英制 / 中国市制…），每组一个 panel -->
            <div class="panel">
              <h3 class="panel-title">公制</h3>
              <div class="grid grid-2">
                <!-- TODO: 每个单位一个 field，data-unit="<key>" -->
                <div class="field">
                  <label class="field-label">米 (m)</label>
                  <input class="input" type="number" data-unit="m" placeholder="0">
                </div>
                <div class="field">
                  <label class="field-label">千米 (km)</label>
                  <input class="input" type="number" data-unit="km" placeholder="0">
                </div>
                <div class="field">
                  <label class="field-label">厘米 (cm)</label>
                  <input class="input" type="number" data-unit="cm" placeholder="0">
                </div>
                <div class="field">
                  <label class="field-label">毫米 (mm)</label>
                  <input class="input" type="number" data-unit="mm" placeholder="0">
                </div>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">英制</h3>
              <div class="grid grid-2">
                <div class="field">
                  <label class="field-label">英里 (mi)</label>
                  <input class="input" type="number" data-unit="mi" placeholder="0">
                </div>
                <div class="field">
                  <label class="field-label">英尺 (ft)</label>
                  <input class="input" type="number" data-unit="ft" placeholder="0">
                </div>
              </div>
            </div>

          </div>

          <!-- 右：侧栏 -->
          <aside>
            <div class="panel">
              <h3 class="panel-title">快速输入</h3>
              <div class="opt-row">
                <button class="btn is-sm" data-quick="1">1</button>
                <button class="btn is-sm" data-quick="10">10</button>
                <button class="btn is-sm" data-quick="100">100</button>
                <button class="btn is-sm" data-quick="1000">1000</button>
              </div>
            </div>

            <div class="panel">
              <h3 class="panel-title">精度</h3>
              <div class="range-row">
                <label>小数位</label>
                <input type="range" min="2" max="10" value="4" data-precision>
                <span class="val" data-precision-val>4</span>
              </div>
            </div>

            <div class="panel">
              <div class="act-group">
                <button class="btn is-primary" data-action="copy-all">
                  <i data-lucide="copy"></i> 复制全部
                </button>
                <button class="btn is-ghost" data-action="reset">
                  <i data-lucide="refresh-cw"></i> 重置
                </button>
              </div>
            </div>

            <div class="panel">
              <p class="hint">输入任意单位数值，其他单位自动换算。</p>
            </div>
          </aside>
        </div>

      </div>
    </div>
  </div></main></div>
  <script type="module" src="../../public/scripts/core/app-init.js"></script>
  <script type="module" src="./page.js"></script>
</body>
</html>
